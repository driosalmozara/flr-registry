<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Chat — Supremacía Femenina</title>
<style>
:root{--gold:#d4af37;--dark:#0f0f1a;--panel:#161625;--line:#2a2a3d}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--dark);color:#fff}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{color:var(--gold)}
main{max-width:1000px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#0b0b12}
.small{color:#a1a1aa;font-size:13px}
input,select{width:100%;background:#0b0b12;border:1px solid var(--line);color:#fff;border-radius:10px;padding:9px 12px;margin:5px 0 10px}
button{background:var(--gold);color:#000;font-weight:700;border:none;border-radius:10px;padding:8px 12px;cursor:pointer}
button.mini{background:transparent;color:#7f1d1d;border:1px solid #7f1d1d;padding:2px 8px;font-size:12px}
  button.msg-del{background:transparent !important;border:none !important;color:#71717a !important;padding:0 5px !important;font-size:11px !important;border-radius:6px !important;opacity:.4;cursor:pointer;margin-left:6px;vertical-align:middle;letter-spacing:0 !important}
button.msg-del:hover{opacity:1;color:#dc2626 !important}
button.clip{background:transparent;color:var(--gold);border:1px solid var(--gold);padding:8px 11px}
button.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);padding:8px 12px}
.navlink{color:var(--gold);text-decoration:none;margin-left:14px}
#irc{display:flex;gap:12px;height:65vh}
#side{width:230px;flex:none;overflow-y:auto;margin:0}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;background:#0b0b12;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:Consolas,Menlo,monospace;font-size:13px}
.line{margin:3px 0;word-wrap:break-word}
.time{color:#71717a}
#inputrow{display:flex;gap:8px;margin-top:8px;position:relative}
#msg{flex:1;margin:0}
.prow{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;border-radius:8px}
.prow:hover{background:#161625}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px;box-shadow:0 0 6px #22c55e}
.nick-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.nick-row label{display:block;font-size:12px;color:#a1a1aa;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.nick-row input,.nick-row select{margin:0}
#rooms-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:#0b0b12;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.room-tab{padding:6px 12px;border-radius:8px;cursor:pointer;background:transparent;border:1px solid transparent;color:#a1a1aa;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.room-tab:hover{color:var(--gold);border-color:rgba(212,175,55,.3)}
.room-tab.active{background:linear-gradient(180deg,rgba(212,175,55,.2),rgba(212,175,55,.05));color:var(--gold);border-color:var(--gold);box-shadow:0 0 12px rgba(212,175,55,.25)}
.room-tab .room-del{margin-left:4px;color:#7f1d1d;opacity:.7;font-size:11px;padding:0 4px;border:none;background:transparent;cursor:pointer}
.room-tab .room-del:hover{opacity:1}
.room-tab.new-tab{color:#4ade80;border:1px dashed rgba(74,222,128,.4)}
.room-tab.new-tab:hover{background:rgba(74,222,128,.08);border-color:#4ade80}
#emoji-btn{background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:16px;line-height:1}
#gif-btn{background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:10px;padding:8px 11px;cursor:pointer;font-weight:700;font-size:13px}
#emoji-panel{position:absolute;bottom:100%;left:0;margin-bottom:6px;background:#0b0b12;border:1px solid var(--gold);border-radius:12px;padding:10px;max-width:320px;width:90vw;max-height:260px;overflow-y:auto;display:none;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#emoji-panel.open{display:block}
#emoji-panel .emo-cat{font-size:11px;color:#a1a1aa;text-transform:uppercase;letter-spacing:.1em;margin:8px 0 4px;font-weight:600}
#emoji-panel .emo-cat:first-child{margin-top:0}
#emoji-panel .emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
#emoji-panel .emo-item{background:transparent;border:none;font-size:20px;padding:4px;cursor:pointer;border-radius:6px;transition:background .15s}
#emoji-panel .emo-item:hover{background:rgba(212,175,55,.15)}
@media (max-width:600px){#irc{flex-direction:column;height:auto}#side{width:100%;max-height:160px}#msgs{height:300px}.nick-row{grid-template-columns:1fr}#rooms-bar{overflow-x:auto;flex-wrap:nowrap}}
  @media (max-width:640px){
  #inputrow{flex-wrap:wrap}
  #msg{order:2;flex:1 1 auto;min-width:0}
  #sendbtn{order:2}
  #inputrow button{padding:8px 12px;font-size:14px}
  button{padding:8px 12px;font-size:14px}
  #msgs{font-size:12px}
  .room-tab{font-size:12px;padding:5px 9px}
  #emoji-panel{width:min(320px,92vw)}
}
</style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="trono-de-oro.css"><script src="toasts.js" defer></script>
</head>
<body>
<header>
  <h1 style="margin:0;">♛ Chat</h1>
  <div><a class="navlink" href="index.html">Inicio</a></div>
</header>
<main>
  <div id="content" class="card">Cargando...</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ofyedqoipexpsvjsipze.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_X4SJUT7cnbFuv7l_1Y3OjQ__poTLx0b';
const GIPHY_KEY = 'oX0m6bGTsnZSJclKOXLZZAxgICUImPlu';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DEFAULT_ROOM_NAME = 'chat-general';
  const DEFAULT_ROOM_LABEL = 'Chat General';

let me = null, myProfile = null;
let isSuper = false, isMod = false, isChatMod = false;
let people = [], presenceChannel = null, onlineIds = new Set();
let selfNicks = [], assignedNicks = [], currentTargets = [];
let ownedSet = new Set(), chatModIds = new Set();
let rooms = [], currentRoomId = null, chatChannel = null;

function esc(v){ return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return 'hsl(' + h + ',70%,65%)';
}

function nameFor(id, fallback) {
  const a = assignedNicks.find(x => x.target_user_id === id);
  if (a) return a.nickname;
  const s = selfNicks.find(x => x.user_id === id);
  if (s) return s.nickname;
  const p = people.find(x => x.id === id);
  return p ? p.display_name : (fallback || '?');
}

async function init() {
  const content = document.getElementById('content');
  const { data: { session } } = await db.auth.getSession();
  if (!session) { content.innerHTML = '<h2>Inicia sesión primero</h2><a class="navlink" href="index.html">Ir al inicio</a>'; return; }
  me = session.user.id;

  const { data: profile } = await db.from('profiles').select('id, role, display_name').eq('id', me).maybeSingle();
  myProfile = profile;
  if (!myProfile) { content.innerHTML = '<h2>Completa tu perfil primero</h2><a class="navlink" href="index.html">Ir al inicio</a>'; return; }

  const [sf, mf, cf] = await Promise.all([
    db.rpc('am_i_superadmin'), db.rpc('am_i_moderator'), db.rpc('am_i_chatmod')
  ]);
  isSuper = !!sf; isMod = !!mf; isChatMod = !!cf;

  await loadRooms(true);
  await renderPage();

  subscribeChat();

  db.channel('flr-chat-media')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_media_pending' }, () => { if (isSuper || isMod || isChatMod) renderPage(); })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chat_media_pending' }, () => { if (isSuper || isMod || isChatMod) renderPage(); })
    .subscribe();

  db.channel('flr-rooms')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_rooms' }, () => loadRooms(false))
    .subscribe();

  presenceChannel = db.channel('flr-presencia', { config: { presence: { key: me } } });
  presenceChannel
    .on('presence', { event: 'sync' }, () => {
      const state = presenceChannel.presenceState();
      onlineIds = new Set();
      Object.values(state).forEach(arr => arr.forEach(p => onlineIds.add(p.user_id)));
      renderParticipants();
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') await presenceChannel.track({ user_id: me });
    });
}

async function loadRooms(initial) {
  const { data } = await db.from('chat_rooms').select('*').order('is_default', { ascending: false }).order('created_at');
  rooms = data || [];
  if (!rooms.length) return;
  if (!currentRoomId || !rooms.find(r => r.id === currentRoomId)) {
    const def = rooms.find(r => r.is_default) || rooms[0];
    currentRoomId = def.id;
  }
  renderRoomsBar();
  if (!initial) await loadMessages();
}

async function loadRoomBans() {
  const { data } = await db.from('chat_room_bans').select('id, user_id, banned_by_role, banned_by').eq('room_id', currentRoomId);
  window._roomBans = data || [];
}

function renderRoomsBar() {
  const bar = document.getElementById('rooms-bar');
  if (!bar) return;
  const canManage = isSuper || isMod;
  bar.innerHTML = rooms.map(r => `
    <button class="room-tab ${r.id === currentRoomId ? 'active' : ''}" onclick="switchRoom('${r.id}')">
      ${r.is_private ? '🔒' : '#'}${r.name === DEFAULT_ROOM_NAME ? DEFAULT_ROOM_LABEL : esc(r.name)}
      ${r.is_private && isSuper ? `<span class="room-del" style="color:#4ade80;" onclick="event.stopPropagation();manageRoomMembers('${r.id}','${esc(r.name)}')" title="Gestionar miembros">👥</span>` : ''}
      ${(isSuper && !r.is_default) ? `<span class="room-del" onclick="event.stopPropagation();deleteRoom('${r.id}','${esc(r.name)}')" title="Eliminar sala">✕</span>` : ''}
    </button>
  `).join('') + (canManage ? `<button class="room-tab new-tab" onclick="createRoom()">＋ Nueva sala</button>` : '');
}

async function switchRoom(id) {
  if (id === currentRoomId) return;
  currentRoomId = id;
  renderRoomsBar();
  subscribeChat();
  await loadRoomBans();
  renderParticipants();
  await renderInputRow();
  await loadMessages();
}

async function createRoom() {
  const name = prompt('Nombre de la sala (sin espacios, sin #):');
  if (!name) return;
  const clean = name.trim().toLowerCase().replace(/[^a-z0-9_\-]/g, '').slice(0, 30);
  if (!clean) return alert('Nombre inválido.');
  if (rooms.find(r => r.name === clean)) return alert('Ya existe una sala con ese nombre.');
  const description = prompt('Descripción breve (opcional):') || '';
  let isPrivate = false;
  if (isSuper) isPrivate = confirm('¿Hacerla SALA PRIVADA?\n\nSolo tú podrás añadir o quitar miembros. Los demás no verán esta sala.');
  const { error } = await db.from('chat_rooms').insert({ name: clean, description, created_by: me, is_private: isPrivate });
  if (error) return alert(error.message);
  await loadRooms(false);
  const fresh = rooms.find(r => r.name === clean);
  if (fresh) switchRoom(fresh.id);
}

async function deleteRoom(id, name) {
  if (!confirm(`¿Eliminar la sala #${name} y todos sus mensajes?`)) return;
  const { error } = await db.from('chat_rooms').delete().eq('id', id);
  if (error) return alert(error.message);
  await loadRooms(false);
}

async function manageRoomMembers(roomId, roomName) {
  const { data: allUsers } = await db.from('profiles').select('id, display_name, role').order('display_name').limit(500);
  const { data: members } = await db.from('chat_room_members').select('user_id').eq('room_id', roomId);
  const memberSet = new Set((members || []).map(m => m.user_id));

  let html = `<h2 style="margin-top:0;">🔒 Miembros de #${esc(roomName)}</h2>
    <p class="small">Solo los miembros listados (y administradores) pueden ver y escribir en esta sala.</p>
    <div style="max-height:50vh;overflow-y:auto;">`;
  (allUsers || []).forEach(u => {
    if (u.id === me) return;
    const isIn = memberSet.has(u.id);
    html += `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #2a2a3d;gap:10px;">
        <span>${u.role === 'dominant' ? '♛' : '⛓'} ${esc(u.display_name)}</span>
        ${isIn
          ? `<button class="danger" style="margin:0;" onclick="removeRoomMember('${roomId}','${u.id}','${esc(roomName)}')">✕ Quitar</button>`
          : `<button style="margin:0;" onclick="addRoomMember('${roomId}','${u.id}','${esc(roomName)}')">＋ Añadir</button>`}
      </div>`;
  });
  html += '</div><p style="margin-top:14px;"><button class="secondary" onclick="closeModal()">Cerrar</button></p>';
  openModal(html);
}

async function addRoomMember(roomId, userId, roomName) {
  const { error } = await db.from('chat_room_members').insert({ room_id: roomId, user_id: userId, added_by: me });
  if (error) return alert(error.message);
  await manageRoomMembers(roomId, roomName);
}

async function removeRoomMember(roomId, userId, roomName) {
  if (!confirm('¿Quitar a este miembro de la sala?')) return;
  const { error } = await db.from('chat_room_members').delete().eq('room_id', roomId).eq('user_id', userId);
  if (error) return alert(error.message);
  await manageRoomMembers(roomId, roomName);
}

function subscribeChat() {
  if (chatChannel) { db.removeChannel(chatChannel); chatChannel = null; }
  chatChannel = db.channel('flr-chat-' + currentRoomId)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'chat_messages',
      filter: 'room_id=eq.' + currentRoomId
    }, () => loadMessages())
    .on('postgres_changes', {
      event: 'DELETE', schema: 'public', table: 'chat_messages',
      filter: 'room_id=eq.' + currentRoomId
    }, () => loadMessages())
    .subscribe();
}

async function renderPage() {
  const content = document.getElementById('content');

  const [p, sn, an, ow, cmods] = await Promise.all([
    db.from('profiles').select('id, display_name, role, chat_muted, is_muzzled:relationships!relationships_submissive_id_fkey(is_muzzled)').order('display_name').limit(300),
    db.from('chat_self_nicknames').select('*'),
    db.from('chat_assigned_nicknames').select('*').order('created_at', { ascending: false }),
    db.from('relationships').select('submissive_id').eq('status', 'confirmed'),
    db.from('app_chat_mods').select('user_id')
  ]);

  people = (p.data || []).map(person => ({
    ...person,
    is_muzzled: person.is_muzzled && person.is_muzzled[0] ? person.is_muzzled[0].is_muzzled : false
  }));
  selfNicks = sn.data || [];
  assignedNicks = an.data || [];
  ownedSet = new Set((ow.data || []).map(x => x.submissive_id));
  chatModIds = new Set((cmods.data || []).map(x => x.user_id));

  await loadRoomBans();

  const { data: selfNick } = await db.from('chat_self_nicknames').select('*').eq('user_id', me).maybeSingle();
  const { data: assignedNick } = await db.from('chat_assigned_nicknames').select('*').eq('target_user_id', me).order('created_at', { ascending: false }).limit(1).maybeSingle();

  let html = `
    <div class="card">
      <h3>Tu identidad en el chat</h3>
      <p class="small">Apareces como: <b style="color:${colorFor(nameFor(me))}">${esc(nameFor(me))}</b>
      ${assignedNick ? '· (apodo asignado por tu Dominante o un Administrador)' : ''}</p>
      <input id="self_nick" placeholder="Tu apodo propio" value="${esc(selfNick?.nickname || '')}" />
      <button onclick="setSelfNick()">Guardar mi apodo</button>
    </div>
  `;

  if (isSuper || myProfile.role === 'dominant') {
    let targets = [];
    if (isSuper) {
      targets = people.filter(x => x.id !== me);
    } else {
      const { data: subs } = await db.from('relationships')
        .select('profiles!relationships_submissive_id_fkey(id, display_name, role)')
        .eq('dominant_id', me).eq('status', 'confirmed');
      targets = (subs || []).map(s => s.profiles).filter(Boolean);
    }
    currentTargets = targets;
    if (targets.length > 0) {
      html += `
        <div class="card">
          <h3>${isSuper ? 'Apodos como Administrador' : 'Apodos para tus sumisos'}</h3>
          <div class="nick-row">
            <div>
              <label for="assign_target">Miembro</label>
              <select id="assign_target">
                <option value="">— Seleccionar —</option>
                ${targets.map(t => `<option value="${t.id}">${t.role === 'dominant' ? '♛' : '⛓'} ${esc(t.display_name)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label for="assign_nick">Nuevo apodo</label>
              <input id="assign_nick" placeholder="Escribe el apodo" />
            </div>
            <div><button onclick="assignNickFromSelect()">Asignar</button></div>
          </div>
        </div>
      `;
    }
  }

  if (isSuper || isMod || isChatMod) {
    const { data: pend } = await db.from('chat_media_pending').select('*').eq('status', 'pending').order('created_at', { ascending: true });
    const list = pend || [];
    if (list.length) {
      html += `
        <div class="card">
          <h3>📎 Medios por aprobar (${list.length})</h3>
          ${list.map(q => `
            <div class="item" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
              ${q.type === 'video'
                ? `<video src="${esc(q.url)}" controls style="width:150px;border-radius:8px;"></video>`
                : `<img src="${esc(q.url)}" style="width:90px;height:90px;object-fit:cover;border-radius:8px;"/>`}
              <div style="flex:1;min-width:150px;">
                <b>${esc(nameFor(q.user_id))}</b>
                <div class="small">${new Date(q.created_at).toLocaleString()} · ${q.type === 'video' ? 'Video' : 'Foto'}</div>
              </div>
              <button onclick="mediaDecide('${q.id}',true)">✓ Aprobar</button>
              <button class="mini" onclick="mediaDecide('${q.id}',false)">✕ Rechazar</button>
            </div>`).join('')}
        </div>`;
    }
  }

  html += `
    <div id="rooms-bar"></div>
    <div id="irc" class="notranslate" translate="no">
      <div id="side" class="card">
        <h3 id="ptitle">Participantes (${people.length})</h3>
        <div id="plist"></div>
      </div>
      <div id="main">
        <div id="msgs"></div>
        <div id="inputrow"></div>
      </div>
    </div>
  `;

  content.innerHTML = html;
  renderRoomsBar();
  renderParticipants();
  await renderInputRow();
  await loadMessages();
}

function renderParticipants() {
  const box = document.getElementById('plist');
  const title = document.getElementById('ptitle');
  if (title) title.innerHTML = `Participantes (${people.length}) · <span style="color:#22c55e;">En línea (${onlineIds.size})</span>`;

  box.innerHTML = people.map(p => {
    const n = nameFor(p.id);
    const chatMuted = p.chat_muted || false;
    const online = onlineIds.has(p.id);
    const isMuzzled = p.is_muzzled || false;
    const owned = ownedSet.has(p.id);
    const canMute = p.id !== me && p.role === 'submissive' && (isSuper || ((isMod || isChatMod) && !owned));
    const isBannedHere = (window._roomBans || []).find(b => b.user_id === p.id);
    const canBan = p.id !== me && (isSuper || isMod || isChatMod);

    return `
      <div class="prow">
        <span style="color:${isMuzzled ? '#dc2626' : chatMuted ? '#f59e0b' : colorFor(n)}">
          ${online ? '<span class="dot"></span>' : ''}${p.role === 'dominant' ? '♛' : '⛓'} ${esc(n)}${chatModIds.has(p.id) ? ' <span style="color:#4ade80;font-size:11px;" title="Moderador de chat">🎙</span>' : ''}${isMuzzled ? ' <span style="color:#dc2626;font-weight:700;">(AMORDAZADO)</span>' : ''}${chatMuted ? ' <span style="color:#f59e0b;font-weight:700;">(SILENCIADO)</span>' : ''}
        </span>
        <span>
          ${canMute ? `<button class="mini" onclick="chatMuteToggle('${p.id}', ${!chatMuted})">${chatMuted ? '🔊' : '🔇'}</button>` : ''}
          ${canBan && !isBannedHere ? `<button class="mini" onclick="banFromRoom('${p.id}','${esc(n)}')" title="Prohibir en esta sala">🚫</button>` : ''}
          ${isBannedHere ? `<button class="mini" style="color:#4ade80;border-color:#4ade80;" onclick="liftRoomBan('${isBannedHere.id}','${isBannedHere.banned_by_role}')" title="Levantar ban (por ${isBannedHere.banned_by_role})">✓ readmitir</button>` : ''}
        </span>
      </div>
    `;
  }).join('');
}

async function renderInputRow() {
  const row = document.getElementById('inputrow');
  if (!row) return;

  if (currentRoomId) {
    const currentRoom = rooms.find(r => r.id === currentRoomId);
    if (currentRoom && currentRoom.is_private) {
      const { data: isMember } = await db.from('chat_room_members')
        .select('user_id').eq('room_id', currentRoomId).eq('user_id', me).maybeSingle();
      if (!isMember && !isSuper) {
        row.innerHTML = '<p class="small" style="color:#dc2626;">🔒 Sala privada: solo miembros invitados pueden escribir.</p>';
        return;
      }
    }
  }

  const myBan = (window._roomBans || []).find(b => b.user_id === me);
  if (myBan) {
    row.innerHTML = `<p class="small" style="color:#dc2626;">🚫 Tu acceso a esta sala está prohibido por ${esc(myBan.banned_by_role)}${myBan.reason ? ' · motivo: ' + esc(myBan.reason) : ''}.</p>`;
    return;
  }

  const { data: myProfileData } = await db.from('profiles').select('chat_muted').eq('id', me).maybeSingle();
  if (myProfileData && myProfileData.chat_muted) {
    row.innerHTML = '<p class="small" style="color:#f59e0b;">🔇 Has sido silenciado por el Staff. No puedes participar en el chat.</p>';
    return;
  }

  const { data: myRel } = await db.from('relationships').select('is_muzzled').eq('submissive_id', me).eq('status', 'confirmed').maybeSingle();
  if (myRel && myRel.is_muzzled) {
    row.innerHTML = '<p class="small" style="color:#dc2626;">🔇 Estás amordazado por tu Dominante. No puedes participar en el chat.</p>';
    return;
  }

  row.innerHTML = `
    <div id="emoji-panel">
      <div class="emo-cat">Caras</div>
      <div class="emo-grid">${['😀','😁','😂','🤣','😊','😍','','😘','😜','🤔','😏','😎','🥺','','😭','😡','🤯','','😴','🤤'].map(e => `<button class="emo-item" onclick="insertEmoji('${e}')">${e}</button>`).join('')}</div>
      <div class="emo-cat">Corazones y gestos</div>
      <div class="emo-grid">${['❤️','🧡','💛','💚','💙','💜','🖤','🤍','💔','💖','💕','💘','👑','⛓','🔥','✨','💫','⭐','🌟','💎'].map(e => `<button class="emo-item" onclick="insertEmoji('${e}')">${e}</button>`).join('')}</div>
      <div class="emo-cat">Manos</div>
      <div class="emo-grid">${['👍','👎','👏','','🤝','','✌️','','🤟','','👊','✊','🤛','🤜','👋','💪','🙌','👐','🤲',''].map(e => `<button class="emo-item" onclick="insertEmoji('${e}')">${e}</button>`).join('')}</div>
      <div class="emo-cat">Objetos</div>
      <div class="emo-grid">${['🌹','🍷','🍾','🎂','🎁','🎉','🎊','🎵','🎶','📷','💌','📱','💻','⚡','☕','🍫','🍓','🌙','🗝','⚔️'].map(e => `<button class="emo-item" onclick="insertEmoji('${e}')">${e}</button>`).join('')}</div>
    </div>
    <input type="file" id="chatfile" accept="image/*,video/*" style="display:none" onchange="attachChat(this)"/>
    <button class="clip" title="Enviar foto o video (requiere aprobación del Staff)" onclick="document.getElementById('chatfile').click()">📎</button>
    <button id="emoji-btn" type="button" title="Emojis" onclick="toggleEmoji(event)">😀</button>
    <button id="gif-btn" type="button" title="GIF" onclick="openGifPicker()">GIF</button>
    <input id="msg" placeholder="Escribe y pulsa Enter..." onkeydown="if(event.key==='Enter') sendMsg()" />
    <button id="sendbtn" onclick="sendMsg()">Enviar</button>  `;
  document.addEventListener('click', closeEmojiOutside, true);
}

async function attachChat(input){
  const file = input.files[0]; if (!file) return;
  const path = me + '/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.\-_]/g, '');
  const { error } = await db.storage.from('chat-media').upload(path, file);
  if (error) return alert(error.message);
  const url = db.storage.from('chat-media').getPublicUrl(path).data.publicUrl;
  const { error: e2 } = await db.from('chat_media_pending').insert({
    user_id: me, url, type: file.type.startsWith('video') ? 'video' : 'image'
  });
  if (e2) return alert(e2.message);
  alert('📎 Archivo enviado a revisión.\nUn Moderador de chat, Moderadora o Administradora deberá aprobarlo antes de publicarse.');
  input.value = '';
}

async function mediaDecide(id, approve){
  const { error } = await db.rpc('chat_media_decide', { pending_id: id, approve });
  if (error) return alert(error.message);
  await renderPage();
}

async function loadMessages() {
  const box = document.getElementById('msgs');
  if (!box || !currentRoomId) return;

  const myBan = (window._roomBans || []).find(b => b.user_id === me);
  if (myBan) {
    box.innerHTML = `<p class="small" style="color:#dc2626;text-align:center;padding:40px;">🚫 No tienes acceso a esta sala.</p>`;
    return;
  }

  const { data } = await db.from('chat_messages_public')
    .select('*')
    .eq('room_id', currentRoomId)
    .order('created_at', { ascending: false })
    .limit(200);
  const list = (data || []).reverse();

  box.innerHTML = list.map(m => {
    const t = new Date(m.created_at);
    const hh = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
    let att = '';
    let bodyText = m.body || '';
    const gifMatch = bodyText.match(/https?:\/\/\S+?giphy\S*|https?:\/\/\S+?tenor\S*|https?:\/\/\S+\.gif(?:\?\S*)?/i);
    if (gifMatch) {
      bodyText = bodyText.replace(gifMatch[0], '').trim();
      att += `<div><img src="${esc(gifMatch[0])}" style="max-width:200px;max-height:200px;border-radius:8px;display:block;margin:4px 0;cursor:pointer;" onclick="window.open(this.src)"/></div>`;
    }
    if (m.attachment_url) {
      att += m.attachment_type === 'video'
        ? `<div><video src="${esc(m.attachment_url)}" controls style="max-width:260px;border-radius:8px;display:block;margin:4px 0;"></video></div>`
        : `<div><img src="${esc(m.attachment_url)}" style="max-width:200px;max-height:200px;border-radius:8px;display:block;margin:4px 0;cursor:pointer;" onclick="window.open(this.src)"/></div>`;
    }
    return `
      <div class="line">
        <span class="time">[${hh}]</span>
        <span style="color:${colorFor(m.display_name)};font-weight:700;">&lt;${esc(m.display_name)}&gt;</span>
        ${esc(bodyText)}
        ${att}
        ${(m.user_id === me || isSuper || isMod || isChatMod) ? `<button class="msg-del" title="Eliminar mensaje" onclick="deleteMsg('${m.id}')">✕</button>` : ''}      </div>
    `;
  }).join('') || '<p class="small">Todavía no hay mensajes en esta sala. Sé el primero en hablar.</p>';

  box.scrollTop = box.scrollHeight;
}

async function sendMsg() {
  const input = document.getElementById('msg');
  const body = input.value.trim();
  if (!body || !currentRoomId) return;
  const { error } = await db.from('chat_messages').insert({ user_id: me, body, room_id: currentRoomId });
  if (error) return alert(error.message);
  input.value = '';
  await loadMessages();
}

async function deleteMsg(id) {
  const { error } = await db.from('chat_messages').delete().eq('id', id);
  if (error) return alert(error.message);
  await loadMessages();
}

async function chatMuteToggle(id, shouldMute) {
  const myRole = isSuper ? 'admin' : (isMod ? 'moderator' : 'chatmod');
  if (shouldMute) {
    const { error } = await db.from('profiles').update({
      chat_muted: true, chat_muted_by: me, chat_muted_by_role: myRole
    }).eq('id', id);
    if (error) return alert(error.message);
  } else {
    const { data } = await db.rpc('lift_chat_mute', { target_user_id: id, lifter_role: myRole });
    if (!data || !data.ok) return alert(data?.error || 'No se pudo levantar.');
  }
  await renderPage();
}

async function banFromRoom(userId, name) {
  if (!currentRoomId) return;
  const myRole = isSuper ? 'admin' : (isMod ? 'moderator' : 'chatmod');
  const reason = prompt(`Motivo del ban a ${name} en esta sala (opcional):`) || null;
  const { error } = await db.from('chat_room_bans').insert({
    room_id: currentRoomId, user_id: userId, banned_by: me, banned_by_role: myRole, reason
  });
  if (error) return alert(error.message);
  await renderPage();
}

async function liftRoomBan(banId, banRole) {
  const myRole = isSuper ? 'admin' : (isMod ? 'moderator' : 'chatmod');
  const { data } = await db.rpc('lift_room_ban', { ban_id: banId, lifter_role: myRole });
  if (!data || !data.ok) return alert(data?.error || 'No se pudo readmitir.');
  await renderPage();
}

async function setSelfNick() {
  const nickname = document.getElementById('self_nick').value.trim();
  if (nickname.length < 2) return alert('El apodo debe tener al menos 2 caracteres.');
  const { error } = await db.from('chat_self_nicknames').upsert({ user_id: me, nickname }, { onConflict: 'user_id' });
  if (error) return alert(error.message);
  window.location.reload();
}

async function assignNickFromSelect() {
  const targetId = document.getElementById('assign_target').value;
  const nickname = document.getElementById('assign_nick').value.trim();
  if (!targetId) return alert('Selecciona un miembro.');
  if (nickname.length < 2) return alert('El apodo debe tener al menos 2 caracteres.');
  const { error } = await db.from('chat_assigned_nicknames').insert({ target_user_id: targetId, nickname, assigned_by: me });
  if (error) return alert(error.message);
  alert('Apodo asignado.');
  window.location.reload();
}

function toggleEmoji(ev) {
  if (ev) ev.stopPropagation();
  const p = document.getElementById('emoji-panel');
  if (p) p.classList.toggle('open');
}
function closeEmojiOutside(ev) {
  const p = document.getElementById('emoji-panel');
  const b = document.getElementById('emoji-btn');
  if (!p || !b) return;
  if (!p.contains(ev.target) && ev.target !== b) p.classList.remove('open');
}
function insertEmoji(e) {
  const input = document.getElementById('msg');
  if (!input) return;
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? input.value.length;
  input.value = input.value.slice(0, start) + e + input.value.slice(end);
  input.focus();
  const pos = start + e.length;
  input.setSelectionRange(pos, pos);
  const p = document.getElementById('emoji-panel');
  if (p) p.classList.remove('open');
}

function openModal(html) {
  let m = document.getElementById('flr-modal');
  if (!m) {
    m = document.createElement('div');
    m.id = 'flr-modal';
    m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:99990;display:flex;align-items:center;justify-content:center;padding:20px;';
    m.innerHTML = '<div style="background:#161625;border:1px solid #d4af37;border-radius:14px;padding:22px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;"></div>';
    document.body.appendChild(m);
  }
  m.querySelector('div').innerHTML = html;
  m.style.display = 'flex';
}

function closeModal() {
  const m = document.getElementById('flr-modal');
  if (m) m.style.display = 'none';
}

async function openGifPicker() {
  const query = prompt('Buscar GIF:');
  if (!query) return;
  openModal('<p class="small">Buscando...</p>');
  try {
    const r = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_KEY}&q=${encodeURIComponent(query)}&limit=20&rating=g`);
    if (!r.ok) throw new Error('sin clave');
    const j = await r.json();
    const gifs = j.data || [];
    if (!gifs.length) throw new Error('vacío');
    let html = `<h2 style="margin-top:0;">GIFs: ${esc(query)}</h2><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:60vh;overflow-y:auto;">`;
    gifs.forEach(g => {
      const url = g.images.downsized_medium?.url || g.images.original?.url;
      html += `<img src="${url}" style="width:100%;border-radius:8px;cursor:pointer;" onclick="pickGif('${url}')"/>`;
    });
    html += '</div><p style="margin-top:14px;"><button class="secondary" onclick="closeModal()">Cancelar</button></p>';
    openModal(html);
  } catch(e) {
    window.open('https://giphy.com/search/' + encodeURIComponent(query), '_blank');
    openModal(`
      <p class="small">El buscador automático requiere una <b>clave gratuita de GIPHY</b>.<br><br>
      Mientras tanto: se abrió la búsqueda en otra pestaña. Copia la URL de un GIF (terminada en <b>.gif</b>) y pégala aquí:</p>
      <input id="gif-url" placeholder="https://media.giphy.com/....gif" style="width:100%;background:#0b0b12;border:1px solid #2a2a3d;color:#fff;border-radius:10px;padding:9px 12px;margin:6px 0;"/>
      <button onclick="pickGif(document.getElementById('gif-url').value.trim())">Insertar GIF</button>
      <button class="secondary" onclick="closeModal()">Cancelar</button>`);
  }
}

function pickGif(url) {
  const input = document.getElementById('msg') || document.getElementById('mbody');
  if (!input) return;
  input.value = (input.value + ' ' + url).trim();
  input.focus();
  closeModal();
}

init();
