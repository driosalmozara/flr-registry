<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Chat — Supremacía Femenina</title>
<style>
:root{--gold:#d4af37;--dark:#0f0f1a;--panel:#161625;--line:#2a2a3d}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--dark);color:#fff}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{color:var(--gold)}
main{max-width:1000px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#0b0b12}
.small{color:#a1a1aa;font-size:13px}
input,select{width:100%;background:#0b0b12;border:1px solid var(--line);color:#fff;border-radius:10px;padding:9px 12px;margin:5px 0 10px}
button{background:var(--gold);color:#000;font-weight:700;border:none;border-radius:10px;padding:8px 12px;cursor:pointer}
button.mini{background:transparent;color:#7f1d1d;border:1px solid #7f1d1d;padding:2px 8px;font-size:12px}
.navlink{color:var(--gold);text-decoration:none;margin-left:14px}

#irc{display:flex;gap:12px;height:65vh}
#side{width:230px;flex:none;overflow-y:auto;margin:0}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;background:#0b0b12;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:Consolas,Menlo,monospace;font-size:13px}
.line{margin:3px 0;word-wrap:break-word}
.time{color:#71717a}
#inputrow{display:flex;gap:8px;margin-top:8px}
#msg{flex:1;margin:0}
.prow{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;border-radius:8px}
.prow:hover{background:#161625}
@media (max-width:600px){
  #irc{flex-direction:column;height:auto}
  #side{width:100%;max-height:160px}
  #msgs{height:300px}
}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px;box-shadow:0 0 6px #22c55e}

/* ── Desplegable compacto de apodos ── */
.nick-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.nick-row label{display:block;font-size:12px;color:#a1a1aa;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.nick-row input,.nick-row select{margin:0}
@media (max-width:600px){.nick-row{grid-template-columns:1fr}}
</style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="trono-de-oro.css"><script src="toasts.js" defer></script>
</head>
<body>
<header>
  <h1 style="margin:0;">♛ #supremacia</h1>
  <div><a class="navlink" href="index.html">Inicio</a></div>
</header>
<main>
  <div id="content" class="card">Cargando...</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ofyedqoipexpsvjsipze.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_X4SJUT7cnbFuv7l_1Y3OjQ__poTLx0b';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null;
let myProfile = null;
let isSuper = false;
let mutes = [];
let people = [];
let presenceChannel = null;
let onlineIds = new Set();
let selfNicks = [];
let assignedNicks = [];
let currentTargets = [];

function esc(v){
  return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return 'hsl(' + h + ',70%,65%)';
}

function nameFor(id, fallback) {
  const a = assignedNicks.find(x => x.target_user_id === id);
  if (a) return a.nickname;
  const s = selfNicks.find(x => x.user_id === id);
  if (s) return s.nickname;
  const p = people.find(x => x.id === id);
  return p ? p.display_name : (fallback || '?');
}

async function init() {
  const content = document.getElementById('content');
  const { data: { session } } = await db.auth.getSession();

  if (!session) {
    content.innerHTML = '<h2>Inicia sesión primero</h2><a class="navlink" href="index.html">Ir al inicio</a>';
    return;
  }

  me = session.user.id;

  const { data: profile } = await db.from('profiles').select('id, role, display_name').eq('id', me).maybeSingle();
  myProfile = profile;

  if (!myProfile) {
    content.innerHTML = '<h2>Completa tu perfil primero</h2><a class="navlink" href="index.html">Ir al inicio</a>';
    return;
  }

  const { data: superFlag } = await db.rpc('am_i_superadmin');
  isSuper = !!superFlag;

  await renderPage();

  db.channel('flr-chat')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, () => loadMessages())
    .subscribe();
    presenceChannel = db.channel('flr-presencia', { config: { presence: { key: me } } });

  presenceChannel
    .on('presence', { event: 'sync' }, () => {
      const state = presenceChannel.presenceState();
      onlineIds = new Set();
      Object.values(state).forEach(arr => arr.forEach(p => onlineIds.add(p.user_id)));
      renderParticipants();
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await presenceChannel.track({ user_id: me });
      }
    });
}

async function renderPage() {
  const content = document.getElementById('content');

  const [p, sn, an, mt] = await Promise.all([
    db.from('profiles').select('id, display_name, role').order('display_name').limit(300),
    db.from('chat_self_nicknames').select('*'),
    db.from('chat_assigned_nicknames').select('*').order('created_at', { ascending: false }),
    db.from('chat_mutes').select('user_id')
  ]);

  people = p.data || [];
  selfNicks = sn.data || [];
  assignedNicks = an.data || [];
  mutes = (mt.data || []).map(x => x.user_id);

  const { data: selfNick } = await db.from('chat_self_nicknames').select('*').eq('user_id', me).maybeSingle();
  const { data: assignedNick } = await db.from('chat_assigned_nicknames').select('*').eq('target_user_id', me).order('created_at', { ascending: false }).limit(1).maybeSingle();

  let html = `
    <div class="card">
      <h3>Tu identidad en el chat</h3>
      <p class="small">Apareces como: <b style="color:${colorFor(nameFor(me))}">${esc(nameFor(me))}</b>
      ${assignedNick ? '· (apodo asignado por tu Dominante o un Administrador)' : ''}</p>
      <input id="self_nick" placeholder="Tu apodo propio" value="${esc(selfNick?.nickname || '')}" />
      <button onclick="setSelfNick()">Guardar mi apodo</button>
    </div>
  `;

  // ── NUEVO: panel compacto con desplegable ──
  if (isSuper || myProfile.role === 'dominant') {
    let targets = [];

    if (isSuper) {
      targets = people.filter(x => x.id !== me);
    } else {
      const { data: subs } = await db
        .from('relationships')
        .select('profiles!relationships_submissive_id_fkey(id, display_name, role)')
        .eq('dominant_id', me)
        .eq('status', 'confirmed');
      targets = (subs || []).map(s => s.profiles).filter(Boolean);
    }

    currentTargets = targets;

    if (targets.length > 0) {
      html += `
        <div class="card">
          <h3>${isSuper ? 'Apodos como Administrador' : 'Apodos para tus sumisos'}</h3>
          <p class="small">Elige un miembro, escribe el apodo y asigna. Sin scroll.</p>
          <div class="nick-row">
            <div>
              <label for="assign_target">Miembro</label>
              <select id="assign_target">
                <option value="">— Seleccionar —</option>
                ${targets.map(t => `<option value="${t.id}">${t.role === 'dominant' ? '♛' : '⛓'} ${esc(t.display_name)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label for="assign_nick">Nuevo apodo</label>
              <input id="assign_nick" placeholder="Escribe el apodo" />
            </div>
            <div>
              <button onclick="assignNickFromSelect()">Asignar</button>
            </div>
          </div>
        </div>
      `;
    }
  }

  html += `
    <div id="irc">
      <div id="side" class="card">
        <h3 id="ptitle">Participantes (${people.length})</h3>
        <div id="plist"></div>
      </div>
      <div id="main">
        <div id="msgs"></div>
        <div id="inputrow"></div>
      </div>
    </div>
  `;

  content.innerHTML = html;

  renderParticipants();
  renderInputRow();
  await loadMessages();
}

function renderParticipants() {
  const box = document.getElementById('plist');
  const title = document.getElementById('ptitle');

  if (title) {
    title.innerHTML = `Participantes (${people.length}) · <span style="color:#22c55e;">En línea (${onlineIds.size})</span>`;
  }

  box.innerHTML = people.map(p => {
    const n = nameFor(p.id);
    const muted = mutes.includes(p.id);
    const online = onlineIds.has(p.id);

    return `
      <div class="prow">
        <span style="color:${colorFor(n)}">
          ${online ? '<span class="dot"></span>' : ''}${p.role === 'dominant' ? '♛' : '⛓'} ${esc(n)}${muted ? ' 🔇' : ''}
        </span>
        ${isSuper && p.id !== me ? `
          <button class="mini" onclick="muteToggle('${p.id}')">${muted ? '🔊' : '🔇'}</button>
        ` : ''}
      </div>
    `;
  }).join('');
}

function renderInputRow() {
  const row = document.getElementById('inputrow');

  if (mutes.includes(me)) {
    row.innerHTML = '<p class="small">🔇 Estás silenciado por un Administrador. No puedes enviar mensajes.</p>';
    return;
  }

  row.innerHTML = `
    <input id="msg" placeholder="Escribe y pulsa Enter..." onkeydown="if(event.key==='Enter') sendMsg()" />
    <button onclick="sendMsg()">Enviar</button>
  `;
}

async function loadMessages() {
  const box = document.getElementById('msgs');
  if (!box) return;

  const { data } = await db
    .from('chat_messages_public')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(200);

  const list = (data || []).reverse();

  box.innerHTML = list.map(m => {
    const t = new Date(m.created_at);
    const hh = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');

    return `
      <div class="line">
        <span class="time">[${hh}]</span>
        <span style="color:${colorFor(m.display_name)};font-weight:700;">&lt;${esc(m.display_name)}&gt;</span>
        ${esc(m.body)}
        ${(m.user_id === me || isSuper) ? `<button class="mini" onclick="deleteMsg('${m.id}')">✕</button>` : ''}
      </div>
    `;
  }).join('') || '<p class="small">Todavía no hay mensajes.</p>';

  box.scrollTop = box.scrollHeight;
}

async function sendMsg() {
  const input = document.getElementById('msg');
  const body = input.value.trim();

  if (!body) return;

  const { error } = await db.from('chat_messages').insert({ user_id: me, body });

  if (error) return alert(error.message);

  input.value = '';
  await loadMessages();
}

async function deleteMsg(id) {
  const { error } = await db.from('chat_messages').delete().eq('id', id);
  if (error) return alert(error.message);
  await loadMessages();
}

async function muteToggle(id) {
  if (mutes.includes(id)) {
    const { error } = await db.from('chat_mutes').delete().eq('user_id', id);
    if (error) return alert(error.message);
  } else {
    const { error } = await db.from('chat_mutes').insert({ user_id: id, muted_by: me });
    if (error) return alert(error.message);
  }

  await renderPage();
}

async function setSelfNick() {
  const nickname = document.getElementById('self_nick').value.trim();

  if (nickname.length < 2) return alert('El apodo debe tener al menos 2 caracteres.');

  const { error } = await db
    .from('chat_self_nicknames')
    .upsert({ user_id: me, nickname }, { onConflict: 'user_id' });

  if (error) return alert(error.message);

  window.location.reload();
}

// ── NUEVA: asignar apodo desde el desplegable ──
async function assignNickFromSelect() {
  const targetId = document.getElementById('assign_target').value;
  const nickname = document.getElementById('assign_nick').value.trim();

  if (!targetId) return alert('Selecciona un miembro.');
  if (nickname.length < 2) return alert('El apodo debe tener al menos 2 caracteres.');

  const { error } = await db.from('chat_assigned_nicknames').insert({
    target_user_id: targetId,
    nickname,
    assigned_by: me
  });

  if (error) return alert(error.message);

  alert('Apodo asignado.');
  window.location.reload();
}

// Se conserva por compatibilidad, aunque ya no se usa desde la UI
async function assignNick(targetId) {
  const nickname = document.getElementById('assign_' + targetId).value.trim();

  if (nickname.length < 2) return alert('El apodo debe tener al menos 2 caracteres.');

  const { error } = await db.from('chat_assigned_nicknames').insert({
    target_user_id: targetId,
    nickname,
    assigned_by: me
  });

  if (error) return alert(error.message);

  alert('Apodo asignado.');
  window.location.reload();
}

init();
</script>

}
</script>

</body>
</html>
