<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Muro — Queendomland</title>
<style>
:root{--gold:#d4af37;--dark:#0f0f1a;--panel:#161625;--line:#2a2a3d}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--dark);color:#fff}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{color:var(--gold)}
main{max-width:760px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.small{color:#a1a1aa;font-size:13px}
textarea,input{width:100%;background:#0b0b12;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px 12px;margin:5px 0 10px;font-family:inherit}
button{background:var(--gold);color:#000;font-weight:700;border:none;border-radius:10px;padding:8px 12px;cursor:pointer;min-height:0 !important;letter-spacing:.02em !important}
button.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
button.mini{background:transparent !important;color:#71717a !important;border:none !important;padding:0 5px !important;font-size:11px !important;font-weight:400 !important}
button.mini:hover{color:#dc2626 !important}
.navlink{color:var(--gold);text-decoration:none;margin-left:14px}
.post{border:1px solid var(--line);border-radius:14px;background:#0b0b12;padding:14px;margin-bottom:14px}
.post .head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.ava{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#161625;flex:none}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);font-size:11px}
.badge.wait{border-color:#f59e0b;color:#f59e0b}
.badge.no{border-color:#dc2626;color:#dc2626}
.badge.poll{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.08)}
.badge.closed{border-color:#dc2626;color:#dc2626;background:rgba(220,38,38,.08)}
.media img{max-width:100%;border-radius:10px;margin:6px 0}
.media video{max-width:100%;border-radius:10px;margin:6px 0}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.acts button{background:transparent !important;color:#a1a1aa !important;border:1px solid var(--line) !important;padding:4px 10px !important;font-size:12px !important;font-weight:500 !important;border-radius:9px !important}
.acts button:hover{color:var(--gold) !important;border-color:var(--gold) !important}
.rbar{display:flex;gap:5px;margin:6px 0;flex-wrap:wrap}
.rbtn{background:transparent !important;border:1px solid var(--line) !important;border-radius:999px !important;padding:2px 9px !important;color:#a1a1aa !important;font-size:12px !important;font-weight:400 !important;line-height:1.4 !important;cursor:pointer}
.rbtn:hover{border-color:var(--gold) !important}
.rbtn.mine{border-color:var(--gold) !important;color:var(--gold) !important;background:rgba(212,175,55,.1) !important}
.rbtn span{margin-left:4px;font-size:10px;color:inherit}
.rbar.sm{margin:3px 0}
.rbar.sm .rbtn{padding:1px 7px !important;font-size:11px !important}
.cmt{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.cmt .small b{color:var(--gold)}
.reply{margin-left:26px;border-left:2px solid var(--line);padding-left:10px;margin-top:6px}
.linkbtn{background:transparent !important;border:none !important;color:#a1a1aa !important;font-size:11px !important;cursor:pointer;padding:2px 6px !important;font-weight:400 !important}
.linkbtn:hover{color:var(--gold) !important}
.emojibtn{background:transparent !important;border:1px solid var(--line) !important;color:#fff !important;padding:3px 8px !important;font-size:13px !important;border-radius:9px !important;cursor:pointer}
#emojipop{position:absolute;z-index:99999;display:none;grid-template-columns:repeat(8,32px);gap:2px;background:rgba(13,10,14,.98);border:1px solid rgba(212,175,55,.5);border-radius:12px;padding:8px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
#emojipop span{cursor:pointer;font-size:19px;text-align:center;border-radius:8px}
#emojipop span:hover{background:rgba(212,175,55,.15)}
.hidden{display:none}
.staff-ico{margin-left:5px;vertical-align:middle;font-size:13px}
.staff-ico.mod{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;color:#d4af37;border:1px solid #d4af37;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:1}

/* Encuestas */
.poll-box{border:1px solid var(--gold);border-radius:12px;padding:14px;margin:10px 0;background:rgba(212,175,55,.05)}
.poll-q{font-size:15px;font-weight:600;margin:0 0 12px;color:#fff}
.poll-opt-btn{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;background:#0b0b12;border:1px solid var(--line);border-radius:8px;color:var(--gold);cursor:pointer;font-size:14px;font-weight:600;transition:.15s}
.poll-opt-btn:hover:not(:disabled){border-color:var(--gold);background:rgba(212,175,55,.08)}
.poll-opt-btn:disabled{opacity:.6;cursor:not-allowed}
.poll-bar{margin:6px 0;padding:10px 12px;background:#161625;border:1px solid var(--line);border-radius:8px;position:relative;overflow:hidden}
.poll-bar .fill{position:absolute;inset:0;background:rgba(212,175,55,.2)}
.poll-bar .txt{position:relative;display:flex;justify-content:space-between;gap:8px;font-size:13px;z-index:1}
.poll-bar .txt .mine-mark{color:var(--gold);font-weight:700}
.poll-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:#a1a1aa}
.poll-form-opts{margin:8px 0}
.poll-form-opts .row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.poll-form-opts .row input{flex:1;margin:0}
.poll-form-opts .row button{padding:4px 10px;font-size:12px}

/* ====== COMENTARIOS COLAPSABLES ====== */
.comment-thread{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.comment-thread:first-child{border-top:none;padding-top:0}
.comment-container,.reply-container{
  transition:max-height .35s ease, opacity .25s ease, margin .25s ease;
  overflow:hidden;
}
.comment-container.collapsed,.reply-container.collapsed{
  max-height:0 !important;
  opacity:0;
  margin-top:0 !important;
  padding-top:0 !important;
  padding-bottom:0 !important;
}
.collapse-btn{
  background:transparent !important;
  border:1px solid var(--line) !important;
  color:#a1a1aa !important;
  padding:4px 10px !important;
  font-size:12px !important;
  font-weight:500 !important;
  border-radius:999px !important;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:all .2s;
}
.collapse-btn:hover{
  color:var(--gold) !important;
  border-color:var(--gold) !important;
  background:rgba(212,175,55,.05) !important;
}
.collapse-btn .arrow{
  display:inline-block;
  font-size:10px;
  transition:transform .25s ease;
}
.collapse-btn.collapsed .arrow{
  transform:rotate(-90deg);
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="trono-de-oro.css"><script src="toasts.js" defer></script><script src="traductor-muro.js" defer></script><script src="colab-switch.js" defer></script><script src="apps-menu.js" defer></script>
</head>
<body>
<header>
  <h1 style="margin:0;">🧱 Muro</h1>
  <div><a class="navlink" href="index.html">Inicio</a></div>
</header>
<main><div id="content" class="card">Cargando...</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ofyedqoipexpsvjsipze.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_X4SJUT7cnbFuv7l_1Y3OjQ__poTLx0b';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const RMAP = [['like','👍'],['love','❤️'],['down','👎'],['angry','😡']];
const EMOJIS = ['😀','😂','😍','😘','😎','🥰','','😢','😭','😡','🤬','👍','👎','🙏','','💪','','❤️','💛','💜','🖤','💋','','👑','','🍷','✨','🤍','⛓','🐕','🦮'];

let me = null, isSuper = false, isMod = false, isChatMod = false, myBlock = null, myMuzzled = false, mySubIds = new Set(), pendingFile = null;
let reactions = [];
let adminIds = new Set(), modIds = new Set(), chatModIds = new Set();

function esc(v){ return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function staffIcons(userId){
  let s = '';
  if (adminIds.has(userId)) s += '<span class="staff-ico" title="Administradora">👑</span>';
  if (modIds.has(userId)) s += '<span class="staff-ico mod" title="Moderadora">M</span>';
  if (chatModIds.has(userId)) s += '<span class="staff-ico" title="Perro Guardián">🐕‍🦺</span>';
  return s;
}
function hh(t){ const d = new Date(t); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ' · ' + d.toLocaleDateString(); }
function mediaHTML(p){
  if (!p.media_url) return '';
  if (p.media_type === 'image') return `<div class="media"><img src="${esc(p.media_url)}"/></div>`;
  if (p.media_type === 'video') return `<div class="media"><video src="${esc(p.media_url)}" controls style="max-width:100%;border-radius:10px;margin:6px 0;"></video></div>`;
  if (p.media_type === 'audio') return `<div class="media"><audio src="${esc(p.media_url)}" controls style="width:100%;margin:6px 0;"></audio></div>`;
  return `<div class="media"><a href="${esc(p.media_url)}" target="_blank" style="color:var(--gold);">📄 Archivo adjunto</a></div>`;
}

function rCounts(tid){
  const o = { like:0, love:0, down:0, angry:0 };
  reactions.filter(r => r.target_id === tid).forEach(r => { o[r.reaction] = (o[r.reaction]||0)+1; });
  return o;
}
function myReact(tid){ const r = reactions.find(x => x.target_id === tid && x.user_id === me); return r ? r.reaction : null; }
function rbar(ttype, tid, small){
  const c = rCounts(tid), mine = myReact(tid);
  return `<div class="rbar${small ? ' sm' : ''}">` + RMAP.map(x =>
    `<button class="rbtn ${mine === x[0] ? 'mine' : ''}" onclick="react('${ttype}','${tid}','${x[0]}')">${x[1]}${c[x[0]] ? `<span>${c[x[0]]}</span>` : ''}</button>`
  ).join('') + `</div>`;
}

async function react(ttype, tid, r){
  const ex = myReact(tid);
  if (ex === r) await db.from('muro_reactions').delete().eq('target_type',ttype).eq('target_id',tid).eq('user_id',me);
  else await db.from('muro_reactions').upsert(
    { target_type:ttype, target_id:tid, user_id:me, reaction:r },
    { onConflict: 'target_type,target_id,user_id' }
  );
  await render();
}

function openEmoji(btn, inputId){
  let pop = document.getElementById('emojipop');
  if (!pop) {
    pop = document.createElement('div'); pop.id = 'emojipop';
    pop.innerHTML = EMOJIS.map(e => `<span onclick="insEmoji('${e}')">${e}</span>`).join('');
    document.body.appendChild(pop);
    document.addEventListener('click', function(e){
      if (!pop.contains(e.target) && !e.target.classList.contains('emojibtn')) pop.style.display = 'none';
    });
  }
  pop.dataset.target = inputId;
  const r = btn.getBoundingClientRect();
  pop.style.display = 'grid';
  pop.style.top = (r.bottom + 6 + window.scrollY) + 'px';
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 300)) + 'px';
}
function insEmoji(e){
  const pop = document.getElementById('emojipop');
  const input = document.getElementById(pop.dataset.target);
  if (input) { input.value += e; input.focus(); }
}

/* === ENCUESTAS === */
let pollOptCount = 0;
function addPollOption(value = '') {
  pollOptCount++;
  const list = document.getElementById('poll-options-list');
  if (!list) return;
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `
    <input type="text" class="poll-opt" placeholder="Opción ${pollOptCount}" value="${esc(value)}"/>
    <button type="button" class="ghost" onclick="this.parentNode.remove()">✕</button>
  `;
  list.appendChild(row);
}

async function createPoll() {
  const question = document.getElementById('poll-question').value.trim();
  if (!question) return alert('Escribe la pregunta de la encuesta.');
  const opts = Array.from(document.querySelectorAll('.poll-opt')).map(i => i.value.trim()).filter(Boolean);
  if (opts.length < 2) return alert('Añade al menos 2 opciones.');
  if (opts.length > 10) return alert('Máximo 10 opciones.');
  const allowComments = document.getElementById('poll-allow-comments').checked;
  const as = document.getElementById('was')?.value || 'user';

  const { data: relOwn } = await db.from('relationships')
    .select('id').eq('submissive_id', me).eq('status', 'confirmed').maybeSingle();
  const initialStatus = (isSuper || isMod) ? 'approved' : (relOwn ? 'owner_pending' : 'pending');

  const { error } = await db.from('muro_posts').insert({
    author_id: me,
    post_type: 'poll',
    poll_question: question,
    poll_options: opts,
    poll_allow_comments: allowComments,
    body: '[Encuesta] ' + question,
    allow_comments: allowComments,
    status: initialStatus,
    post_as: as
  });
  if (error) return alert(error.message);
  alert(initialStatus === 'approved' ? '📊 Encuesta publicada.' : '📊 Encuesta enviada. Queda pendiente de aprobación.');
  document.getElementById('poll-question').value = '';
  document.getElementById('poll-options-list').innerHTML = '';
  pollOptCount = 0;
  addPollOption(); addPollOption();
  await render();
}

async function renderPoll(post, comments) {
  const options = post.poll_options || [];
  const { data: results } = await db.rpc('poll_results', { p_post_id: post.id });
  const { data: myVote } = await db.rpc('my_poll_vote', { p_post_id: post.id });
  const votesByOption = {};
  let totalVotes = 0;
  (results || []).forEach(r => { votesByOption[r.option_index] = Number(r.votes); totalVotes += Number(r.votes); });
  const closed = post.poll_closed_at && new Date(post.poll_closed_at) < new Date();
  const hasVoted = myVote !== null && myVote !== undefined;

  let optsHtml = options.map((opt, i) => {
    const votes = votesByOption[i] || 0;
    const pct = totalVotes > 0 ? Math.round((votes / totalVotes) * 100) : 0;
    const isMine = myVote === i;
    if (hasVoted || closed) {
      return `<div class="poll-bar">
        <div class="fill" style="width:${pct}%;"></div>
        <div class="txt">
          <span class="${isMine ? 'mine-mark' : ''}">${isMine ? '♛ ' : ''}${esc(opt)}</span>
          <b>${votes} (${pct}%)</b>
        </div>
      </div>`;
    } else {
      return `<button class="poll-opt-btn" onclick="votePoll('${post.id}', ${i})">${esc(opt)}</button>`;
    }
  }).join('');

  return `<div class="poll-box">
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;">
      <span style="font-size:18px;">📊</span>
      <b style="color:var(--gold);">Encuesta</b>
      ${closed ? '<span class="badge closed">Cerrada</span>' : ''}
    </div>
    <p class="poll-q">${esc(post.poll_question)}</p>
    ${optsHtml}
    <div class="poll-foot">
      <span>${totalVotes} voto${totalVotes === 1 ? '' : 's'}${hasVoted ? ' · Tu voto: ♛' : ' · Aún no has votado'}</span>
      ${!post.poll_allow_comments ? '<span>💬 Comentarios desactivados</span>' : ''}
    </div>
  </div>`;
}

async function votePoll(postId, optionIndex) {
  const { data } = await db.rpc('vote_poll', { p_post_id: postId, p_option_index: optionIndex });
  if (!data || !data.ok) return alert(data?.error || 'No se pudo votar.');
  await render();
}

async function closePoll(postId) {
  if (!confirm('¿Cerrar esta encuesta? Nadie podrá votar más.')) return;
  const { error } = await db.from('muro_posts').update({ poll_closed_at: new Date().toISOString() }).eq('id', postId);
  if (error) return alert(error.message);
  alert('Encuesta cerrada. Los votos quedan fijos.');
  await render();
}

async function deletePoll(postId) {
  if (!confirm('¿Eliminar esta encuesta y todos sus votos?')) return;
  const { error } = await db.from('muro_posts').delete().eq('id', postId);
  if (error) return alert(error.message);
  await render();
}

async function init() {
  const content = document.getElementById('content');
  const { data: { session } } = await db.auth.getSession();
  if (!session) { content.innerHTML = '<h2>Inicia sesión primero</h2><a class="navlink" href="index.html">Ir al inicio</a>'; return; }
  me = session.user.id;

  const [sf, mf, bl, mz, subs, cm, adm, mod] = await Promise.all([
    db.rpc('am_i_superadmin'), db.rpc('am_i_moderator'),
    db.from('muro_blocks').select('*').eq('user_id', me).maybeSingle(),
    db.from('relationships').select('is_muzzled').eq('submissive_id', me).eq('status', 'confirmed').maybeSingle(),
    db.from('relationships').select('submissive_id').eq('dominant_id', me).eq('status', 'confirmed'),
    db.from('app_chat_mods').select('user_id'),
    db.from('app_admins').select('user_id'),
    db.from('app_moderators').select('user_id')
  ]);
  adminIds = new Set((adm.data||[]).map(x=>x.user_id));
  modIds = new Set((mod.data||[]).map(x=>x.user_id));
  chatModIds = new Set((cm.data||[]).map(x=>x.user_id));
  isSuper = !!sf.data; isMod = !!mf.data; isChatMod = !!cm.data;
  myBlock = bl.data;
  myMuzzled = !!(mz.data && mz.data.is_muzzled);
  mySubIds = new Set((subs.data || []).map(x => x.submissive_id));

  await render();

  db.channel('muro-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'muro_posts' }, () => render())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'muro_comments' }, () => render())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'muro_reactions' }, () => render())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'poll_votes' }, () => render())
    .subscribe();
}

async function render() {
  const content = document.getElementById('content');
  let html = '';

  if (isSuper || isMod) {
    const { data: blocks } = await db.from('muro_blocks').select('*, profiles!muro_blocks_user_id_fkey(display_name)').order('created_at', { ascending: false });
    if (blocks && blocks.length) {
      html += `<div class="card"><h3 style="margin-top:0;">🚫 Bloqueados para publicar</h3>`;
      blocks.forEach(b => {
        html += `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);">
          <span>⛓ ${esc(b.profiles?.display_name || '?')} <span class="small">· por ${esc(b.blocked_by_role)}</span></span>
          <button class="ghost" onclick="unblock('${b.user_id}')">✓ Desbloquear</button>
        </div>`;
      });
      html += `</div>`;
    }
  }

  if (myMuzzled) {
    html += `<div class="card"><p class="small" style="color:#dc2626;">🔇 Estás amordazado: no puedes enviar publicaciones ni encuestas mientras dure la mordaza.</p></div>`;
  } else if (myBlock) {
    html += `<div class="card"><p class="small" style="color:#dc2626;">🚫 El Staff te ha bloqueado temporalmente para publicar.${myBlock.reason ? ' Motivo: ' + esc(myBlock.reason) : ''}</p></div>`;
  } else {
    html += `
      <div class="card">
        <h3 style="margin-top:0;">✍️ Publicar en el muro</h3>
        <textarea id="wbody" rows="3" placeholder="Comparte con la casa..."></textarea>
        <div style="display:flex;gap:6px;margin:-4px 0 8px;">
          <button class="emojibtn" onclick="openEmoji(this,'wbody')">😊</button>
        </div>
        <input type="file" id="wfile" style="display:none" onchange="pickFile(this)"/>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <button class="ghost" onclick="document.getElementById('wfile').click()">📎 Adjuntar</button>
          <span id="wfilechip" class="small"></span>
          <label class="small" style="display:flex;gap:6px;align-items:center;margin-left:auto;">
            <input type="checkbox" id="wallow" checked style="width:auto;margin:0;"/> Permitir comentarios
          </label>
          ${(isSuper || isMod) ? `
          <label class="small" style="display:flex;gap:6px;align-items:center;">
            Identidad:
            <select id="was" style="width:auto;margin:0;background:#0b0b12;color:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;">
              <option value="user">Mi nombre</option>
              <option value="staff">🛡 Staff Queendomland</option>
              ${isSuper ? '<option value="anon">👤 Sin nombre</option>' : ''}
            </select>
          </label>` : ''}
        </div>
        <p style="margin:10px 0 0;"><button onclick="submitPost()">${(isSuper || isMod) ? 'Publicar ahora' : 'Enviar a aprobación'}</button></p>
        <p class="small" style="margin:6px 0 0;">${(isSuper || isMod) ? 'Como Staff, tu voz entra directa al muro.' : 'Toda publicación es revisada por el Staff; los sumisos con Dueña, además, por ella.'}</p>
      </div>`;

    html += `
      <div class="card" style="border-color:rgba(212,175,55,.3);">
        <h3 style="margin-top:0;">📊 Crear encuesta</h3>
        <label class="small">Pregunta</label>
        <input id="poll-question" placeholder="Ej: ¿Qué dinámicas te gustan más?"/>
        <label class="small" style="margin-top:8px;display:block;">Opciones (añade y quita)</label>
        <div id="poll-options-list" class="poll-form-opts"></div>
        <button type="button" class="ghost" onclick="addPollOption()" style="margin-top:4px;">+ Añadir opción</button>
        <label class="small" style="margin-top:12px;display:flex;gap:8px;align-items:center;">
          <input type="checkbox" id="poll-allow-comments" style="width:auto;margin:0;" checked/>
          Permitir comentarios en esta encuesta
        </label>
        ${(isSuper || isMod) ? `
        <label class="small" style="display:flex;gap:6px;align-items:center;margin-top:8px;">
          Identidad:
          <select id="was2" style="width:auto;margin:0;background:#0b0b12;color:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;">
            <option value="user">Mi nombre</option>
            <option value="staff">🛡 Staff Queendomland</option>
            ${isSuper ? '<option value="anon">👤 Sin nombre</option>' : ''}
          </select>
        </label>` : ''}
        <p style="margin:10px 0 0;"><button onclick="createPoll()">📊 Publicar encuesta</button></p>
        <p class="small" style="margin:6px 0 0;">Las encuestas quedan sujetas a aprobación del Staff (y de tu Dueña, si la tienes).</p>
      </div>`;

    setTimeout(() => {
      if (document.getElementById('poll-options-list') && pollOptCount === 0) {
        addPollOption(); addPollOption();
      }
    }, 50);
  }

  const { data: posts } = await db.from('muro_posts')
    .select('*, author:profiles!muro_posts_author_id_fkey(id, display_name, role, avatar_url)')
    .order('created_at', { ascending: false }).limit(120);
  const list = (posts || []).filter(p =>
    p.status === 'approved' || p.author_id === me || isSuper || isMod || mySubIds.has(p.author_id) || (isChatMod && p.status === 'pending' && p.author?.role === 'submissive')
  );

  list.sort((a, b) => {
    if (a.pinned_by && !b.pinned_by) return -1;
    if (!a.pinned_by && b.pinned_by) return 1;
    if (a.pinned_by && b.pinned_by) return new Date(b.pinned_at) - new Date(a.pinned_at);
    return new Date(b.created_at) - new Date(a.created_at);
  });

  window.__posts = list;
  const ids = list.map(p => p.id);
  let comments = [];
  if (ids.length) {
    const cm = await db.from('muro_comments').select('*, author:profiles!muro_comments_author_id_fkey(display_name, role)').in('post_id', ids).order('created_at');
    comments = cm.data || [];
  }
  const allIds = ids.concat(comments.map(c => c.id));
  reactions = [];
  if (allIds.length) {
    const rk = await db.from('muro_reactions').select('*').in('target_id', allIds);
    reactions = rk.data || [];
  }

  const ownedSubs = new Set();
  if (isChatMod && !(isSuper || isMod)) {
    const pendingAuthorIds = list.filter(p => p.status === 'pending' && p.author?.role === 'submissive').map(p => p.author_id);
    if (pendingAuthorIds.length) {
      const { data: ownedRels } = await db.from('relationships')
        .select('submissive_id')
        .in('submissive_id', pendingAuthorIds)
        .eq('status', 'confirmed');
      (ownedRels || []).forEach(r => ownedSubs.add(r.submissive_id));
    }
  }

  const queue = list.filter(p =>
    (p.status === 'pending' && (isSuper || isMod || (isChatMod && p.author?.role === 'submissive' && !ownedSubs.has(p.author_id)))) ||
    (p.status === 'owner_pending' && mySubIds.has(p.author_id))
  );
  if (queue.length) {
    html += `<div class="card"><h3 style="margin-top:0;">📥 Aprobaciones pendientes (${queue.length})</h3>`;
    queue.forEach(p => {
      const isPoll = p.post_type === 'poll';
      html += `
        <div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#0b0b12;">
          <p class="small" style="margin:0 0 6px;">
            <b style="color:var(--gold);">${esc(p.author?.display_name || '?')}</b>
            ${isPoll ? ' <span class="badge poll">📊 encuesta</span>' : ''}
            · ${p.status === 'pending' ? '⏳ espera Staff' : '⏳ espera a su Dueña'}
          </p>
          ${isPoll ? `<p style="margin:0 0 6px;"><b>📊 ${esc(p.poll_question || '')}</b><br><span class="small">${(p.poll_options || []).map(o => '· ' + esc(o)).join('<br>')}</span></p>` : `<p style="margin:0 0 6px;white-space:pre-wrap;">${esc(p.body || '')}</p>`}
          ${mediaHTML(p)}
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            ${((isSuper || isMod) || (isChatMod && p.author?.role === 'submissive' && !ownedSubs.has(p.author_id))) && p.status === 'pending' ? `<button onclick="staffApprove('${p.id}')">✅ Aprobar</button><button onclick="staffReject('${p.id}')">❌ Rechazar</button>` : ''}
            ${p.status === 'owner_pending' && mySubIds.has(p.author_id) ? `<button onclick="ownerApprove('${p.id}')">✅ Aprobar</button><button onclick="ownerReject('${p.id}')">❌ Rechazar</button>` : ''}
          </div>
        </div>`;
    });
    html += `</div>`;
  }

  html += '<h3>🏛 Muro de la casa</h3>';
  if (!list.length) html += '<p class="small">Aún no hay publicaciones. Sé la primera voz del muro.</p>';

  for (const p of list) {
    const cmts = comments.filter(c => c.post_id === p.id);
    const isPoll = p.post_type === 'poll';
    const canDelete = p.author_id === me || isSuper || isMod || mySubIds.has(p.author_id) || (isChatMod && p.author?.role === 'submissive');
    const canStaffAct = ((isSuper || isMod) || (isChatMod && p.author?.role === 'submissive' && !ownedSubs.has(p.author_id))) && p.status === 'pending';
    const canOwnerAct = p.status === 'owner_pending' && mySubIds.has(p.author_id);
    const canBlock = (isSuper) || ((isMod || isChatMod) && p.author?.role === 'submissive' && !mySubIds.has(p.author_id));

    let badge = '';
    if (p.status === 'pending') badge = '<span class="badge wait">⏳ espera Staff</span>';
    if (p.status === 'owner_pending') badge = '<span class="badge wait">⏳ espera a su Dueña</span>';
    if (p.status === 'rejected') badge = '<span class="badge no">❌ rechazada</span>';
    if (isPoll) badge = '<span class="badge poll">📊 encuesta</span> ' + badge;

    const media = mediaHTML(p);
    const pollHTML = isPoll ? await renderPoll(p, comments) : '';
    const topLevelCmts = cmts.filter(c => !c.parent_id);
    const cmtCount = topLevelCmts.length;

    html += `
      <div class="post">
        <div class="head">
          ${p.post_as === 'anon'
            ? '<div class="ava" style="display:flex;align-items:center;justify-content:center;color:#a1a1aa;">👤</div>'
            : (p.post_as === 'staff'
              ? '<div class="ava" style="display:flex;align-items:center;justify-content:center;color:#f59e0b;">🛡</div>'
              : `<img class="ava" src="${esc(p.author?.avatar_url || '')}" onerror="this.style.visibility='hidden'"/>`)}
          <div>
            ${p.post_as === 'anon' ? '' : `<b style="color:${p.post_as === 'staff' ? '#f59e0b' : (p.author?.role === 'dominant' ? 'var(--gold)' : '#8ab4f8')}">${p.post_as === 'staff' ? '🛡 Staff Queendomland' : (p.author?.role === 'dominant' ? '♛ ' : '⛓ ') + esc(p.author?.display_name || '?')}</b>${p.post_as === 'user' ? staffIcons(p.author_id) : ''}`}
            <div class="small">${hh(p.created_at)} ${badge}${p.pinned_by ? ' · 📌 fijada' : ''}</div>
          </div>
        </div>
        ${isPoll ? pollHTML : `<div class="post-body" style="white-space:pre-wrap;">${esc(p.body || '')}</div>${media}${rbar('post', p.id, false)}`}
        <div class="acts">
          ${!isPoll ? `<button onclick="document.getElementById('ci_${p.id}')?.focus()">💬 ${cmtCount || ''} Comentarios</button>` : ''}
          ${canStaffAct ? `<button onclick="staffApprove('${p.id}')">✅ Aprobar</button><button onclick="staffReject('${p.id}')">❌ Rechazar</button>` : ''}
          ${canOwnerAct ? `<button onclick="ownerApprove('${p.id}')">✅ Aprobar</button><button onclick="ownerReject('${p.id}')">❌ Rechazar</button>` : ''}
          ${isPoll && (canDelete || canStaffAct || canOwnerAct) && p.status === 'approved' && !p.poll_closed_at ? `<button onclick="closePoll('${p.id}')">🔒 Cerrar</button>` : ''}
          ${canDelete ? `<button onclick="${isPoll ? `deletePoll('${p.id}')` : `delPost('${p.id}')`}">🗑 Eliminar</button>` : ''}
          ${canBlock ? `<button onclick="blockUser('${p.author_id}')">🚫 Bloquear</button>` : ''}
          ${(isSuper || isMod) ? (p.pinned_by ? `<button onclick="unpinPost('${p.id}')">📌 Desfijar</button>` : `<button onclick="pinPost('${p.id}')">📌 Fijar</button>`) : ''}
        </div>
        ${p.allow_comments && p.status === 'approved' ? `
        <div class="cmt">
          ${cmtCount > 0 ? `
            <button class="collapse-btn" onclick="toggleAllComments('${p.id}', this)" style="margin-bottom:8px;">
              <span class="arrow">▼</span>
              <span class="count">${cmtCount} comentario${cmtCount === 1 ? '' : 's'}</span>
            </button>
            <div id="comments_${p.id}" class="comment-container">
              ${topLevelCmts.map(c => commentHTML(c, cmts)).join('')}
            </div>
          ` : ''}
          <div style="display:flex;gap:6px;margin-top:8px;align-items:center;">
            <input id="ci_${p.id}" placeholder="Comentar..." style="margin:0;"/>
            <button class="emojibtn" onclick="openEmoji(this,'ci_${p.id}')">😊</button>
            <button onclick="addComment('${p.id}')">Enviar</button>
          </div>
        </div>` : (p.status === 'approved' && !p.allow_comments ? '<p class="small" style="margin:8px 0 0;">💬 Comentarios desactivados por quien publicó.</p>' : '')}
      </div>`;
  }

  content.innerHTML = html;
  // Comentarios y respuestas replegados por defecto
  document.querySelectorAll('.comment-container, .reply-container').forEach(function(el){ el.classList.add('collapsed'); });
  document.querySelectorAll('.collapse-btn').forEach(function(b){ b.classList.add('collapsed'); });
}

function commentHTML(c, all) {
  const replies = all.filter(x => x.parent_id === c.id);
  const canDel = c.author_id === me || isSuper || isMod || (isChatMod && c.author?.role === 'submissive') || mySubIds.has(c.author_id);
  const hasReplies = replies.length > 0;
  
  return `
    <div style="margin:8px 0;" class="comment-thread">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <p class="small" style="margin:4px 0;flex:1;min-width:200px;">
          <b style="color:${c.comment_as === 'staff' ? '#f59e0b' : (c.author?.role === 'dominant' ? 'var(--gold)' : '#8ab4f8')}">
            ${c.comment_as === 'staff' ? '🛡 Staff Queendomland' : (c.comment_as === 'anon' ? '&nbsp;' : (c.author_id === me ? 'Tú' : (c.author?.role === 'dominant' ? '♛ ' : '⛓ ') + esc(c.author?.display_name || 'Miembro')))}
          </b>
          ${c.comment_as === 'user' ? staffIcons(c.author_id) : ''}
          <span class="comment-body" style="color:#d4d4d8;white-space:pre-wrap;">${esc(c.body)}</span>
          <span class="small" style="opacity:.7;">· ${hh(c.created_at)}</span>
          ${canDel ? `<button class="mini" onclick="delComment('${c.id}')">✕</button>` : ''}
        </p>
      </div>
      ${rbar('comment', c.id, true)}
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0;">
        <button class="linkbtn" onclick="toggleReply('${c.id}')">↩ Responder</button>
        ${hasReplies ? `<button class="collapse-btn" onclick="toggleReplies('${c.id}', this)">
          <span class="arrow">▼</span>
          <span class="count">${replies.length} respuesta${replies.length === 1 ? '' : 's'}</span>
        </button>` : ''}
      </div>
      <div id="rb_${c.id}" class="hidden" style="display:flex;gap:6px;margin:6px 0 6px 26px;align-items:center;">
        <input id="ri_${c.id}" placeholder="Responder..." style="margin:0;"/>
        <button class="emojibtn" onclick="openEmoji(this,'ri_${c.id}')">😊</button>
        <button onclick="addReply('${c.id}','${c.post_id}')">Enviar</button>
        <button class="linkbtn" onclick="toggleReply('${c.id}')">Cancelar</button>
      </div>
      <div id="replies_${c.id}" class="reply-container">
        ${replies.map(r => `
          <div class="reply">
            <p class="small" style="margin:4px 0;">
              <b style="color:${r.comment_as === 'staff' ? '#f59e0b' : (r.author?.role === 'dominant' ? 'var(--gold)' : '#8ab4f8')}">
                ${r.comment_as === 'staff' ? '🛡 Staff Queendomland' : (r.comment_as === 'anon' ? '&nbsp;' : (r.author_id === me ? 'Tú' : (r.author?.role === 'dominant' ? '♛ ' : '⛓ ') + esc(r.author?.display_name || 'Miembro')))}
              </b>
              ${r.comment_as === 'user' ? staffIcons(r.author_id) : ''}
              <span class="reply-body" style="color:#d4d4d8;white-space:pre-wrap;">${esc(r.body)}</span>
              <span class="small" style="opacity:.7;">· ${hh(r.created_at)}</span>
              ${(r.author_id === me || isSuper || isMod || (isChatMod && r.author?.role === 'submissive') || mySubIds.has(r.author_id)) ? `<button class="mini" onclick="delComment('${r.id}')">✕</button>` : ''}
            </p>
            ${rbar('comment', r.id, true)}
          </div>
        `).join('')}
      </div>
    </div>`;
}

function toggleReply(id){
  const box = document.getElementById('rb_' + id);
  if (box) box.classList.toggle('hidden');
}

/* ============ COMENTARIOS COLAPSABLES ============ */
function toggleReplies(commentId, btn) {
  const container = document.getElementById('replies_' + commentId);
  if (!container) return;
  const isCollapsed = container.classList.contains('collapsed');
  container.classList.toggle('collapsed');
  btn.classList.toggle('collapsed');
  const replyCount = container.querySelectorAll('.reply').length;
  const countEl = btn.querySelector('.count');
  if (countEl) countEl.textContent = `${replyCount} respuesta${replyCount === 1 ? '' : 's'}`;
}

function toggleAllComments(postId, btn) {
  const container = document.getElementById('comments_' + postId);
  if (!container) return;
  const isCollapsed = container.classList.contains('collapsed');
  container.classList.toggle('collapsed');
  btn.classList.toggle('collapsed');
  const commentCount = container.querySelectorAll('.comment-thread').length;
  const countEl = btn.querySelector('.count');
  if (countEl) countEl.textContent = `${commentCount} comentario${commentCount === 1 ? '' : 's'}`;
}

function pickFile(input){
  const f = input.files[0]; if (!f) return;
  pendingFile = f;
  document.getElementById('wfilechip').textContent = '📎 ' + f.name;
}

async function submitPost() {
  const body = document.getElementById('wbody').value.trim();
  const allow = document.getElementById('wallow').checked;
  const as = document.getElementById('was')?.value || 'user';
  if (!body && !pendingFile) return alert('Escribe algo o adjunta un archivo.');
  let url = null, type = null;
  if (pendingFile) {
    const path = me + '/' + Date.now() + '_' + pendingFile.name.replace(/[^a-zA-Z0-9.\-_]/g, '');
    const { error } = await db.storage.from('muro').upload(path, pendingFile);
    if (error) return alert(error.message);
    url = db.storage.from('muro').getPublicUrl(path).data.publicUrl;
    type = pendingFile.type.startsWith('image') ? 'image' : pendingFile.type.startsWith('video') ? 'video' : pendingFile.type.startsWith('audio') ? 'audio' : 'file';
  }
  const { data } = await db.rpc('muro_submit', { p_body: body, p_media_url: url, p_media_type: type, p_allow_comments: allow, p_as: as });
  if (!data || !data.ok) return alert(data?.error || 'No se pudo enviar.');
  alert(data.status === 'approved' ? '🧱 Publicado en el muro.' : '🧱 Enviada. Será visible cuando el Staff la apruebe.');
  pendingFile = null;
  document.getElementById('wbody').value = '';
  document.getElementById('wfilechip').textContent = '';
  await render();
}

async function addComment(postId) {
  const input = document.getElementById('ci_' + postId);
  const body = input.value.trim();
  if (!body) return;
  const { error } = await db.from('muro_comments').insert({ post_id: postId, author_id: me, body, comment_as: document.getElementById('was')?.value || 'user' });
  if (error) return alert(error.message);
  await render();
}

async function addReply(commentId, postId) {
  const input = document.getElementById('ri_' + commentId);
  const body = input.value.trim();
  if (!body) return;
  const { error } = await db.from('muro_comments').insert({ post_id: postId, author_id: me, body, parent_id: commentId, comment_as: document.getElementById('was')?.value || 'user' });
  if (error) return alert(error.message);
  await render();
}

async function delComment(id) {
  const { data } = await db.rpc('muro_delete_comment', { comment_id: id });
  if (!data || !data.ok) return alert(data?.error || 'No se pudo eliminar.');
  await render();
}

async function delPost(id) {
  let reason = null;
  if (isSuper || isMod) reason = prompt('Motivo opcional a enviar al autor (déjalo vacío para no avisar):');
  const { data } = await db.rpc('muro_delete_post', { post_id: id, reason });
  if (!data || !data.ok) return alert(data?.error || 'No se pudo eliminar.');
  await render();
}

async function staffApprove(id) {
  const p = (window.__posts || []).find(x => x.id === id);
  if (p && p.author?.role === 'submissive' && !isSuper) {
    const { data: rel } = await db.from('relationships').select('id').eq('submissive_id', p.author_id).eq('status', 'confirmed').maybeSingle();
    if (rel) {
      if (isChatMod && !isMod) {
        alert('⚠ No puedes aprobar esta publicación: el sumiso tiene Dueña. Solo el Staff superior puede saltarse la aprobación de la Dueña.');
        return;
      }
      if (isMod && !isSuper) {
        alert('⚠ No puedes aprobar esta publicación: el sumiso tiene Dueña. Solo las Administradoras pueden saltarse la aprobación de la Dueña.');
        return;
      }
    }
  }
  let bypass = false;
  if (p && p.author?.role === 'submissive' && isSuper) {
    const { data: rel } = await db.from('relationships').select('id').eq('submissive_id', p.author_id).eq('status', 'confirmed').maybeSingle();
    if (rel) {
      bypass = confirm('⚠ Este sumiso tiene Dueña.\n\nSi apruebas como Administración, la publicación entrará directa al muro y su Dueña NO podrá confirmarla.\n\n¿Confirmas la aprobación administrativa?');
    }
  }
  const { data } = await db.rpc('muro_staff_approve', { post_id: id, bypass_owner: bypass });
  if (!data?.ok) alert(data?.error);
  await render();
}
async function staffReject(id) { const r = prompt('Motivo del rechazo (opcional):'); const { data } = await db.rpc('muro_staff_reject', { post_id: id, reason: r }); if (!data?.ok) alert(data?.error); await render(); }
async function ownerApprove(id) { const { data } = await db.rpc('muro_owner_approve', { post_id: id }); if (!data?.ok) alert(data?.error); await render(); }
async function ownerReject(id) { const r = prompt('Motivo del rechazo (opcional):'); const { data } = await db.rpc('muro_owner_reject', { post_id: id, reason: r }); if (!data?.ok) alert(data?.error); await render(); }
async function pinPost(id) { const { data } = await db.rpc('muro_pin', { post_id: id }); if (!data?.ok) alert(data?.error); await render(); }
async function unpinPost(id) { const { data } = await db.rpc('muro_unpin', { post_id: id }); if (!data?.ok) alert(data?.error); await render(); }

async function blockUser(uid) {
  const r = prompt('Motivo del bloqueo (opcional):');
  const { data } = await db.rpc('muro_block', { target: uid, reason: r });
  if (!data?.ok) return alert(data?.error);
  await render();
}
async function unblock(uid) { const { data } = await db.rpc('muro_unblock', { target: uid }); if (!data?.ok) alert(data?.error); await render(); }

init();
</script>

<script>
(function(){
  function injectOnce(){
    if (document.getElementById('insignias-menu-item')) return;
    var links = Array.from(document.querySelectorAll('a, button'));
    var anchor = links.find(function(el){ return /colaboraci/i.test(el.textContent || ''); });
    if (!anchor) return;
    var a = document.createElement('a');
    a.id = 'insignias-menu-item';
    a.href = 'insignias.html';
    a.textContent = '🏅 Insignias';
    a.className = anchor.className;
    a.style.cssText = anchor.style.cssText;
    anchor.parentNode.insertBefore(a, anchor);
  }
  async function gate(){
    try {
      var s = await db.auth.getSession();
      if (!s.data || !s.data.session) return;
      var uid = s.data.session.user.id;
      var res = await Promise.all([
        db.from('app_admins').select('user_id').eq('user_id', uid).maybeSingle(),
        db.from('app_moderators').select('user_id').eq('user_id', uid).maybeSingle()
      ]);
      if (!res[0].data && !res[1].data) return;
      injectOnce();
      new MutationObserver(injectOnce).observe(document.body, { childList: true, subtree: true });
    } catch(e){}
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', gate);
  else gate();
})();
</script>
<script>
(function(){
  let glowInterval = null;
  async function updateMenuGlow(){
    try {
      if (typeof db === 'undefined' || !db) return;
      const { data: s } = await db.auth.getSession();
      if (!s || !s.session) return;
      const { data } = await db.rpc('unread_activity_counts');
      if (!data) return;
      const chatLink = document.querySelector('a[href="chat.html"]');
      const msgsLink = document.querySelector('a[href="mensajes.html"]');
      function apply(link, count){
        if (!link) return;
        link.style.position = 'relative';
        link.classList.toggle('nav-glow', count > 0);
        let badge = link.querySelector('.nav-badge');
        if (count > 0) {
          if (!badge) {
            badge = document.createElement('span');
            badge.className = 'nav-badge';
            link.appendChild(badge);
          }
          badge.textContent = count > 99 ? '99+' : count;
        } else if (badge) {
          badge.remove();
        }
      }
      apply(chatLink, (data.chat || 0) + (data.mentions || 0));
      apply(msgsLink, data.messages || 0);
    } catch(e){ console.warn('Menu glow error:', e); }
  }
  function start(){
    updateMenuGlow();
    if (glowInterval) clearInterval(glowInterval);
    glowInterval = setInterval(updateMenuGlow, 30000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
</body>
</html>
