<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Disciplina — Queendomland</title>
<style>
:root{--gold:#d4af37;--dark:#0f0f1a;--panel:#161625;--line:#2a2a3d;--burg:#9e3a48;--violet:#7c3aed;--violet-l:#a78bfa}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--dark);color:#fff}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{color:var(--gold)}main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.item{border-radius:12px;padding:14px;margin:10px 0}
.item.punishment{border:2px solid var(--burg);background:rgba(110,31,42,.08)}
.item.reward{border:2px solid var(--gold);background:rgba(212,175,55,.06)}
.item.muzzle{border:2px solid #dc2626;background:rgba(220,38,38,.08)}
.item.chastity{border:2px solid var(--violet);background:rgba(124,58,237,.08)}
.item.fulfilled{opacity:.55}
.small{color:#a1a1aa;font-size:13px}
input,select,textarea{width:100%;background:#0b0b12;border:1px solid var(--line);color:#fff;border-radius:10px;padding:9px 12px;margin:5px 0 10px}
button{background:var(--gold);color:#000;font-weight:700;border:none;border-radius:10px;padding:8px 12px;cursor:pointer;margin-right:6px}
button.secondary{background:transparent;color:var(--gold);border:1px solid var(--gold)}
button.danger{background:#7f1d1d;color:#fff}
button.special{color:#fff;border:none;padding:10px 16px;font-weight:700}
button.special.red{background:#dc2626}button.special.green{background:#059669}button.special.violet{background:var(--violet)}
button.quick{background:rgba(212,175,55,.15);color:var(--gold);border:1px solid rgba(212,175,55,.4);padding:6px 10px;font-size:12px;margin:4px 4px 4px 0}
.navlink{color:var(--gold);text-decoration:none;margin-left:14px}
.balance{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.balance-card{background:#0b0b12;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.balance-card .label{color:#a1a1aa;font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.balance-card .value{font-size:22px;font-weight:700}
.balance-card.punishments .value{color:var(--burg)}.balance-card.rewards .value{color:var(--gold)}.balance-card.streak .value{color:#4ade80}
.statusbox{border-radius:10px;padding:14px;margin-bottom:16px;text-align:center}
.statusbox h4{margin:0 0 6px;font-size:18px}
.statusbox p{margin:0 0 6px;font-size:13px}
.statusbox.red{background:rgba(220,38,38,.15);border:2px solid #dc2626}.statusbox.red h4{color:#dc2626}.statusbox.red p{color:#fca5a5}
.statusbox.violet{background:rgba(124,58,237,.14);border:2px solid var(--violet)}.statusbox.violet h4{color:var(--violet-l)}.statusbox.violet p{color:#ddd6fe}
.statusbox .big{font-size:22px;font-weight:800;margin:6px 0 10px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-btn{background:transparent;color:#a1a1aa;border:1px solid var(--line);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.filter-btn.active{background:var(--gold);color:#000;border-color:var(--gold)}
.entry-header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.entry-header h4{margin:0 0 6px;font-size:16px}
.entry-meta{color:#a1a1aa;font-size:12px;margin-top:6px}
.status-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;text-transform:uppercase}
.status-badge.pending{background:rgba(212,175,55,.2);color:var(--gold);border:1px solid var(--gold)}
.status-badge.acknowledged{background:rgba(74,222,128,.2);color:#4ade80;border:1px solid #4ade80}
.status-badge.fulfilled{background:rgba(161,161,170,.2);color:#a1a1aa;border:1px solid #a1a1aa}
.catalog{margin:14px 0;padding:12px;background:#0b0b12;border:1px solid var(--line);border-radius:10px}
.catalog h4{margin:0 0 8px;font-size:13px;color:#a1a1aa;text-transform:uppercase}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="trono-de-oro.css"><script src="toasts.js" defer></script>
</head>
<body>
<header><h1 style="margin:0;">♛ Disciplina</h1><div><a class="navlink" href="index.html">Inicio</a></div></header>
<main><div id="content" class="card">Cargando...</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ofyedqoipexpsvjsipze.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_X4SJUT7cnbFuv7l_1Y3OjQ__poTLx0b';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let me=null,currentFilter='all';

const QUICK_CATALOG={
 punishment:[
  {title:'Desobediencia leve',severity:2,category:'conducta'},
  {title:'Incumplimiento de tarea',severity:3,category:'tareas'},
  {title:'Falta de respeto',severity:4,category:'conducta'},
  {title:'Mentira',severity:3,category:'honestidad'},
  {title:'Retraso injustificado',severity:2,category:'puntualidad'}],
 reward:[
  {title:'Obediencia ejemplar',severity:3,category:'conducta'},
  {title:'Tarea completada con excelencia',severity:2,category:'tareas'},
  {title:'Actitud devota',severity:3,category:'conducta'},
  {title:'Iniciativa propia',severity:2,category:'proactividad'},
  {title:'Lealtad demostrada',severity:4,category:'lealtad'}]
};

function escapeHtml(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function entryIcon(t){if(t==='muzzle')return '🔇';if(t==='chastity')return '🔒';return t==='reward'?'🏅':'⚖';}
function statusLabel(s){if(s==='acknowledged')return 'Aceptado';if(s==='fulfilled')return 'Cumplido';return 'Pendiente';}

function updateChastityCounters(){
  document.querySelectorAll('[data-chastity-start]').forEach(el=>{
    const start=new Date(el.getAttribute('data-chastity-start'));
    const endA=el.getAttribute('data-chastity-end');
    const end=endA?new Date(endA):new Date();
    const ms=Math.max(0,end-start);
    const d=Math.floor(ms/864e5),h=Math.floor((ms%864e5)/36e5);
    el.textContent=(endA?'Duró ':'Lleva ')+d+' días y '+h+' horas';
  });
}
setInterval(updateChastityCounters,60000);

async function init(){
  const content=document.getElementById('content');
  const {data:{session}}=await db.auth.getSession();
  if(!session){content.innerHTML='<h2>Inicia sesión primero</h2>';return;}
  const {data:profile}=await db.from('profiles').select('id,role').eq('id',session.user.id).maybeSingle();
  if(!profile){content.innerHTML='<h2>Completa tu perfil primero</h2>';return;}
  me=profile;
  if(me.role==='dominant')await renderDominant();else await renderSubmissive();
}

function calculateBalance(entries){
  const pun=entries.filter(e=>e.entry_type!=='reward');
  const rew=entries.filter(e=>e.entry_type==='reward');
  const last=pun.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
  const streak=last?Math.floor((new Date()-new Date(last.created_at))/864e5):0;
  return{punishments:pun.length,rewards:rew.length,streak};
}
function renderBalance(b){return `<div class="balance">
 <div class="balance-card punishments"><div class="label">Castigos</div><div class="value">${b.punishments}</div></div>
 <div class="balance-card rewards"><div class="label">Recompensas</div><div class="value">${b.rewards}</div></div>
 <div class="balance-card streak"><div class="label">Racha sin castigos</div><div class="value">${b.streak} días</div></div></div>`;}
function renderFilters(){return `<div class="filters">
 <button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">Todo</button>
 <button class="filter-btn ${currentFilter==='punishment'?'active':''}" onclick="setFilter('punishment')">Solo castigos</button>
 <button class="filter-btn ${currentFilter==='reward'?'active':''}" onclick="setFilter('reward')">Solo recompensas</button></div>`;}
function setFilter(f){currentFilter=f;if(me.role==='dominant')renderDominant();else renderSubmissive();}
function filterEntries(list){if(currentFilter==='all')return list;
 if(currentFilter==='reward')return list.filter(e=>e.entry_type==='reward');
 return list.filter(e=>e.entry_type!=='reward');}
function renderCatalog(relId,type){const items=QUICK_CATALOG[type]||[];
 return `<div class="catalog"><h4>Catálogo rápido — ${type==='punishment'?'Castigos':'Recompensas'}</h4>
 ${items.map((it,i)=>`<button class="quick" onclick="quickAdd('${relId}','${type}',${i})">${entryIcon(type)} ${escapeHtml(it.title)} (Nivel ${it.severity})</button>`).join('')}</div>`;}
function toggleCatalog(relId){document.getElementById('catalog_'+relId).innerHTML=renderCatalog(relId,document.getElementById('type_'+relId).value);}

async function quickAdd(relId,type,i){
  const it=QUICK_CATALOG[type][i];if(!it)return;
  const {error}=await db.from('discipline_entries').insert({relationship_id:relId,entry_type:type,title:it.title,description:'',severity:it.severity,category:it.category,status:'pending',visible_to_submissive:true,created_by:me.id});
  if(error)return alert(error.message);
  await createNotification(relId,type,it.title);
  window.location.reload();
}

async function createNotification(relId,type,title){
  const {data:rel}=await db.from('relationships').select('submissive_id,profiles!relationships_dominant_id_fkey(display_name)').eq('id',relId).maybeSingle();
  if(!rel)return;
  let t,ti,bo;
  if(type==='muzzle'){t='discipline_muzzle';ti='🔇 Has sido amordazado';bo=`${rel.profiles?.display_name||'Tu Dominante'} te impuso mordaza.`;}
  else if(type==='chastity'){t='discipline_chastity';ti='🔒 Has sido puesto en castidad';bo=`${rel.profiles?.display_name||'Tu Dominante'} te impuso castidad. El contador ha comenzado.`;}
  else{t=type==='reward'?'discipline_reward':'discipline_punishment';ti=type==='reward'?'🏅 Nueva recompensa':'⚖ Nuevo castigo';bo=`${rel.profiles?.display_name||'Tu Dominante'} te asignó: ${title}`;}
  await db.from('notifications').insert({user_id:rel.submissive_id,type:t,title:ti,body:bo,link:'disciplina.html'});
}

async function applyMuzzle(relId){
  if(!confirm('¿Aplicar MORDAZA? El sumiso quedará silenciado hasta que la levantes.'))return;
  const {data}=await db.rpc('dom_muzzle',{rel_id:relId,on_val:true});
  if(!data||!data.ok)return alert(data?.error||'Error');
  await createNotification(relId,'muzzle','Mordaza');
  window.location.reload();
}
async function liftMuzzle(relId){
  if(!confirm('¿Levantar la mordaza?'))return;
  const {data}=await db.rpc('dom_muzzle',{rel_id:relId,on_val:false});
  if(!data||!data.ok)return alert(data?.error||'Error');
  window.location.reload();
}

async function applyChastity(relId){
  if(!confirm('¿Aplicar CASTIDAD?\n\nEl contador de días comenzará ahora y solo tú podrás levantarlo.'))return;
  const {error}=await db.from('discipline_entries').insert({relationship_id:relId,entry_type:'chastity',title:'Castidad',description:'Castigo de castidad. El contador corre hasta que la Dominante lo levante.',severity:5,category:'castidad',status:'pending',visible_to_submissive:true,created_by:me.id});
  if(error)return alert(error.message);
  await createNotification(relId,'chastity','Castidad');
  window.location.reload();
}
async function liftChastity(relId){
  if(!confirm('¿Levantar la castidad? El contador se detendrá y quedará registrado cuánto duró.'))return;
  const {data:active}=await db.from('discipline_entries').select('id').eq('relationship_id',relId).eq('entry_type','chastity').eq('status','pending').maybeSingle();
  if(!active)return alert('No hay castidad activa.');
  await db.from('discipline_entries').update({status:'fulfilled',lifted_at:new Date().toISOString()}).eq('id',active.id);
  const {data:rel}=await db.from('relationships').select('submissive_id').eq('id',relId).maybeSingle();
  if(rel)await db.from('notifications').insert({user_id:rel.submissive_id,type:'discipline_chastity_lift',title:'🔓 Castidad levantada',body:'Tu Dominante ha levantado tu castidad.',link:'disciplina.html'});
  window.location.reload();
}

async function renderDominant(){
  const content=document.getElementById('content');
  const {data:domIds}=await db.rpc('my_dominion_ids');
  const ids=domIds||[];
  if(!ids.length){content.innerHTML='<h2>Sin sumisos confirmados</h2>';return;}
  const {data:subs,error}=await db.from('relationships').select('id,dominant_id,is_muzzled,muzzled_at,muzzled_by_entry_id,profiles!relationships_submissive_id_fkey(display_name)').in('submissive_id',ids).eq('status','confirmed');
  if(!subs||!subs.length){content.innerHTML='<h2>Sin sumisos confirmados</h2>';return;}
  const {data:entries}=await db.from('discipline_entries').select('*').in('relationship_id',subs.map(s=>s.id)).order('created_at',{ascending:false});
  let html='';
  subs.forEach(sub=>{
    const isOwnerRel = sub.dominant_id === me.id;
    const muzzleEntry = (entries || []).find(e => e.relationship_id === sub.id && e.entry_type === 'muzzle' && e.status === 'pending');
    const canLiftMuzzle = isOwnerRel || (muzzleEntry && muzzleEntry.created_by === me.id);
    const all=(entries||[]).filter(e=>e.relationship_id===sub.id);
    const bal=calculateBalance(all);
    const filtered=filterEntries(all);
    const activeChastity=all.find(e=>e.entry_type==='chastity'&&e.status==='pending');
    html+=`<div class="card"><h3>⛓ ${escapeHtml(sub.profiles?.display_name||'Sumiso')}</h3>`;
    if(sub.is_muzzled)html+=`<div class="statusbox red"><h4>🔇 AMORDAZADO</h4><p>Desde: ${new Date(sub.muzzled_at).toLocaleString()}</p>${canLiftMuzzle ? `<button class="special green" onclick="liftMuzzle('${sub.id}')">✓ Levantar mordaza</button>` : '<p class="small">Solo quien la impuso o la Dueña del contrato pueden levantarla.</p>'}</div>`;
    if(activeChastity)html+=`<div class="statusbox violet"><h4>🔒 CASTIDAD</h4><p>Aplicada: ${new Date(activeChastity.created_at).toLocaleString()}</p><p class="big" data-chastity-start="${activeChastity.created_at}"></p>${(isOwnerRel || activeChastity.created_by === me.id) ? `<button class="special green" onclick="liftChastity('${sub.id}')">✓ Levantar castidad</button>` : '<p class="small">Solo quien la impuso o la Dueña del contrato pueden levantarla.</p>'}</div>`;
    html+=renderBalance(bal)+renderFilters();
    html+=`<select id="type_${sub.id}" onchange="toggleCatalog('${sub.id}')"><option value="punishment">⚖ Castigo</option><option value="reward">🏅 Recompensa</option></select>
    <div id="catalog_${sub.id}">${renderCatalog(sub.id,'punishment')}</div>
    <input id="title_${sub.id}" placeholder="Título personalizado"/>
    <textarea id="desc_${sub.id}" rows="2" placeholder="Descripción / razón"></textarea>
    <select id="sev_${sub.id}"><option value="1">Nivel 1</option><option value="2">Nivel 2</option><option value="3" selected>Nivel 3</option><option value="4">Nivel 4</option><option value="5">Nivel 5</option></select>
    <button onclick="addEntry('${sub.id}')">Agregar entrada</button>
    ${!sub.is_muzzled?`<button class="special red" onclick="applyMuzzle('${sub.id}')">🔇 Aplicar mordaza</button>`:''}
    ${!activeChastity?`<button class="special violet" onclick="applyChastity('${sub.id}')">🔒 Aplicar castidad</button>`:''}
    <div style="margin-top:16px;">${filtered.map(e=>renderEntry(e,true,isOwnerRel)).join('')||'<p class="small">Sin registros.</p>'}</div></div>`;
  });
  content.innerHTML=html;
  updateChastityCounters();
}

async function renderSubmissive(){
  const content=document.getElementById('content');
  const {data:rel}=await db.from('relationships').select('id,is_muzzled,muzzled_at,profiles!relationships_dominant_id_fkey(display_name)').eq('submissive_id',me.id).eq('status','confirmed').maybeSingle();
  if(!rel){content.innerHTML='<h2>Sin Dominante confirmada</h2>';return;}
  const {data:entries}=await db.from('discipline_entries').select('*').eq('relationship_id',rel.id).eq('visible_to_submissive',true).order('created_at',{ascending:false});
  const all=entries||[];
  const activeChastity=all.find(e=>e.entry_type==='chastity'&&e.status==='pending');
  let html=`<div class="card"><h3>Tu historial con ♛ ${escapeHtml(rel.profiles?.display_name||'Dominante')}</h3>`;
  if(rel.is_muzzled)html+=`<div class="statusbox red"><h4>🔇 ESTÁS AMORDAZADO</h4><p>Desde: ${new Date(rel.muzzled_at).toLocaleString()}</p></div>`;
  if(activeChastity)html+=`<div class="statusbox violet"><h4>🔒 ESTÁS EN CASTIDAD</h4><p>Desde: ${new Date(activeChastity.created_at).toLocaleString()}</p><p class="big" data-chastity-start="${activeChastity.created_at}"></p></div>`;
  html+=renderBalance(calculateBalance(all))+renderFilters();
  html+=`<div style="margin-top:16px;">${filterEntries(all).map(e=>renderEntry(e,false)).join('')||'<p class="small">Sin registros.</p>'}</div></div>`;
  content.innerHTML=html;
  updateChastityCounters();
}

function renderEntry(e,isDominant,isOwnerRel){
  const canAck=!isDominant&&e.status==='pending'&&e.entry_type!=='muzzle'&&e.entry_type!=='chastity';
  const canLift=(isOwnerRel||e.created_by===me.id);
  const canFul=isDominant&&canLift&&(e.status==='pending'||e.status==='acknowledged')&&e.entry_type!=='muzzle'&&e.entry_type!=='chastity';
  let extra='';
  if(e.entry_type==='chastity'){
    extra=e.status==='pending'
      ?`<p class="small" style="color:#a78bfa;" data-chastity-start="${e.created_at}"></p>`
      :`<p class="small" style="color:#a78bfa;" data-chastity-start="${e.created_at}" data-chastity-end="${e.lifted_at||e.updated_at||e.created_at}"></p>`;
  }
  return `<div class="item ${e.entry_type} ${e.status}">
   <div class="entry-header"><div style="flex:1;min-width:200px;">
     <h4><span>${entryIcon(e.entry_type)}</span> ${escapeHtml(e.title)}</h4>
     ${e.description?`<p class="small">${escapeHtml(e.description)}</p>`:''}
     ${extra}
     <div class="entry-meta">Nivel ${e.severity} · ${new Date(e.created_at).toLocaleString()}${e.category?' · '+escapeHtml(e.category):''}</div>
   </div><div><span class="status-badge ${e.status}">${statusLabel(e.status)}</span></div></div>
   <div style="margin-top:10px;">
     ${canAck?`<button onclick="acknowledgeEntry('${e.id}')">✓ Acepto</button>`:''}
     ${canFul?`<button class="secondary" onclick="fulfillEntry('${e.id}')">✓ Marcar cumplido</button>`:''}
     ${isDominant&&e.entry_type!=='muzzle'&&e.entry_type!=='chastity'?`<button class="danger" onclick="deleteEntry('${e.id}')">Eliminar</button>`:''}
   </div></div>`;
}

async function addEntry(relId){
  const type=document.getElementById('type_'+relId).value;
  const title=document.getElementById('title_'+relId).value.trim();
  const desc=document.getElementById('desc_'+relId).value.trim();
  const sev=Number(document.getElementById('sev_'+relId).value);
  if(!title)return alert('Escribe un título o usa el catálogo.');
  const {error}=await db.from('discipline_entries').insert({relationship_id:relId,entry_type:type,title,description:desc,severity:sev,status:'pending',visible_to_submissive:true,created_by:me.id});
  if(error)return alert(error.message);
  await createNotification(relId,type,title);
  window.location.reload();
}
async function acknowledgeEntry(id){
  const {error}=await db.from('discipline_entries').update({status:'acknowledged',acknowledged_at:new Date().toISOString()}).eq('id',id);
  if(error)return alert(error.message);
  window.location.reload();
}
async function fulfillEntry(id){
  const {error}=await db.from('discipline_entries').update({status:'fulfilled',lifted_at:new Date().toISOString()}).eq('id',id);
  if(error)return alert(error.message);
  window.location.reload();
}
async function deleteEntry(id){
  if(!confirm('¿Eliminar este registro?'))return;
  const {error}=await db.from('discipline_entries').delete().eq('id',id);
  if(error)return alert(error.message);
  window.location.reload();
}
init();
</script>
