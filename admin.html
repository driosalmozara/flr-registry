<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Panel de Administración — Supremacía Femenina</title>
<style>
:root{--gold:#d4af37;--dark:#0f0f1a;--panel:#161625;--line:#2a2a3d}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--dark);color:#fff}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{color:var(--gold)}
main{max-width:950px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#0b0b12}
.small{color:#a1a1aa;font-size:13px}
input,select,textarea{width:100%;background:#0b0b12;border:1px solid var(--line);color:#fff;border-radius:10px;padding:8px 10px;margin:4px 0 8px}
button{background:var(--gold);color:#000;font-weight:700;border:none;border-radius:10px;padding:8px 12px;cursor:pointer;margin-right:6px}
button.danger{background:#7f1d1d;color:#fff}
.navlink{color:var(--gold);text-decoration:none;margin-left:14px}
label.small{display:block}
.ava{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex:none;background:#0b0b12}
.ava.empty{display:flex;align-items:center;justify-content:center;background:#161625;color:var(--gold);font-size:18px}
.ava.small{width:36px;height:36px;font-size:14px}
.rowitem{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rel-header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.rel-person{display:flex;align-items:center;gap:8px}
.rel-arrow{color:var(--gold);font-size:20px;font-weight:700}
/* ── Plegables elegantes ── */
details{border:1px solid var(--line);border-radius:14px;margin:0 0 16px;background:var(--panel);overflow:hidden}
summary{cursor:pointer;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
  color:var(--gold);font-weight:600;list-style:none;font-size:15px}
summary::-webkit-details-marker{display:none}
summary::after{content:'▾';transition:.25s;color:var(--gold)}
details[open] summary::after{transform:rotate(180deg)}
details[open] summary{border-bottom:1px solid var(--line)}
details .body{padding:14px 18px}
.count{background:var(--gold);color:#000;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;margin-left:8px}
</style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="trono-de-oro.css"><script src="toasts.js" defer></script>
</head>
<body>
<header>
  <h1 style="margin:0;">♛ Panel de Administración</h1>
  <div><a class="navlink" href="index.html">Inicio</a></div>
</header>
<main>
  <div id="content" class="card">Cargando...</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ofyedqoipexpsvjsipze.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_X4SJUT7cnbFuv7l_1Y3OjQ__poTLx0b';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null;
let users = [], admins = [], mods = [], rels = [], records = [], cards = [];

function esc(v){
  return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function avatarHTML(url, fallback, small) {
  const sizeClass = small ? 'ava small' : 'ava';
  if (url) return `<img class="${sizeClass}" src="${esc(url)}" />`;
  return `<div class="${sizeClass} empty">${fallback}</div>`;
}

const userOf = id => users.find(x => x.id === id) || {};
const nameOf = id => userOf(id).display_name || '?';

async function init() {
  const content = document.getElementById('content');
  const { data: { session } } = await db.auth.getSession();

  if (!session) {
    content.innerHTML = '<h2>Inicia sesión primero</h2><a class="navlink" href="index.html">Ir al inicio</a>';
    return;
  }

  me = session.user.id;

  const { data: isAdmin } = await db.rpc('am_i_superadmin');

  if (!isAdmin) {
    content.innerHTML = '<h2>Acceso denegado</h2><p class="small">Tu cuenta no es Administrador.</p>';
    return;
  }

  await render();
}

async function render() {
  const content = document.getElementById('content');

  const [u, a, m, r, rec, c] = await Promise.all([
    db.from('profiles').select('id, role, display_name, age, bio, created_at, avatar_url').order('created_at', { ascending: false }),
    db.from('app_admins').select('user_id'),
    db.from('app_moderators').select('user_id'),
    db.from('relationships').select('id, status, dominant_id, submissive_id').order('requested_at', { ascending: false }),
    db.from('submissive_records').select('*'),
    db.from('cards').select('*')
  ]);

  users = u.data || [];
  admins = (a.data || []).map(x => x.user_id);
  mods = (m.data || []).map(x => x.user_id);
  rels = r.data || [];
  records = rec.data || [];
  cards = c.data || [];

  let html = '<h2 style="margin-top:0;">♛ Panel de Administración</h2>';

  // ===== ADMINISTRADORES =====
  html += `<details><summary>👑 Administradores <span class="count">${admins.length}</span></summary><div class="body">`;

  users.filter(x => admins.includes(x.id)).forEach(x => {
    html += `<div class="item"><div class="rowitem">`;
    html += avatarHTML(x.avatar_url, '♛');
    html += `<div style="flex:1;min-width:200px;"><b>${x.role === 'dominant' ? '♛' : '⛓'} ${esc(x.display_name)}</b> <span class="small">— Administrador</span></div>`;
    if (x.id !== me) html += `<button class="danger" onclick="removeAdmin('${x.id}')">Quitar privilegios</button>`;
    html += `</div></div>`;
  });

  const candidates = users.filter(x => x.role === 'dominant' && !admins.includes(x.id));
  if (candidates.length > 0) {
    html += `
      <label class="small">Nombrar nueva Administradora</label>
      <select id="newadmin">
        ${candidates.map(x => `<option value="${x.id}">♛ ${esc(x.display_name)}</option>`).join('')}
      </select>
      <button onclick="makeAdmin()">Dar privilegios</button>
    `;
  }
  html += '</div></details>';

    // ===== DOMINANTES PENDIENTES =====
  const pendingDoms = users.filter(x => x.role === 'dominant' && !x.approved);
  html += `<details ${pendingDoms.length ? 'open' : ''}><summary>👑 Dominantes pendientes <span class="count">${pendingDoms.length}</span></summary><div class="body">`;
  html += '<p class="small">Cuentas de Dominantes que esperan aprobación del Staff para activarse.</p>';

  if (pendingDoms.length === 0) {
    html += '<p class="small">No hay Dominantes esperando aprobación.</p>';
  } else {
    pendingDoms.forEach(x => {
      html += `
        <div class="item">
          <div class="rowitem">
            ${avatarHTML(x.avatar_url, '♛')}
            <div style="flex:1;min-width:200px;">
              <b>♛ ${esc(x.display_name)}</b>
              <div class="small">Edad: ${esc(String(x.age || ''))} · País: ${esc(x.country || '?')}</div>
              <div class="small">Registro: ${esc(new Date(x.created_at).toLocaleString())}</div>
              ${x.bio ? `<div class="small" style="margin-top:4px;font-style:italic;">"${esc(x.bio)}"</div>` : ''}
              ${x.social_links ? `<div class="small">📱 ${esc(x.social_links)}</div>` : ''}
            </div>
          </div>
          <div style="margin-top:10px;">
            <button onclick="approveDominant('${x.id}')">✓ Aprobar</button>
            <button class="danger" onclick="rejectDominant('${x.id}')">✕ Rechazar</button>
            <button class="secondary" onclick="impersonate('${x.id}')">👁 Ver como miembro</button>
          </div>
        </div>
      `;
    });
  }
  html += '</div></details>';

  // ===== MODERADORAS =====
  html += `<details><summary>🛡 Moderadoras <span class="count">${mods.length}</span></summary><div class="body">`;
  html += '<p class="small">Pueden silenciar en el chat, prohibir privados y eliminar sumisos sin dueña.</p>';

  users.filter(x => mods.includes(x.id)).forEach(x => {
    html += `<div class="item"><div class="rowitem">`;
    html += avatarHTML(x.avatar_url, '🛡');
    html += `<div style="flex:1;min-width:200px;"><b>${x.role === 'dominant' ? '♛' : '⛓'} ${esc(x.display_name)}</b> <span class="small">— Moderadora</span></div>`;
    html += `<button class="danger" onclick="removeMod('${x.id}')">Quitar</button>`;
    html += `</div></div>`;
  });

  const modCandidates = users.filter(x => !mods.includes(x.id) && !admins.includes(x.id));
  if (modCandidates.length > 0) {
    html += `
      <label class="small">Nombrar nueva Moderadora</label>
      <select id="newmod">
        ${modCandidates.map(x => `<option value="${x.id}">${x.role === 'dominant' ? '♛' : '⛓'} ${esc(x.display_name)}</option>`).join('')}
      </select>
      <button onclick="makeMod()">Nombrar Moderadora</button>
    `;
  }
  html += '</div></details>';

  // ===== MIEMBROS =====
  html += `
    <details><summary>👥 Miembros <span class="count">${users.length}</span></summary><div class="body">
      <label class="small">Elegir miembro para gestionar</label>
      <select id="member_pick" onchange="renderMemberCard()">
        <option value="">— Seleccionar —</option>
        ${users.map(x => `<option value="${x.id}">${x.role === 'dominant' ? '♛' : '⛓'} ${esc(x.display_name)}${admins.includes(x.id) ? ' — ADMIN' : ''}</option>`).join('')}
      </select>
      <div id="member_card"></div>
    </div></details>
  `;

  // ===== RELACIONES Y REGISTROS =====
  html += `
    <details><summary>🔗 Relaciones y registros <span class="count">${rels.length}</span></summary><div class="body">
      <label class="small">Elegir relación para gestionar</label>
      <select id="rel_pick" onchange="renderRelCard()">
        <option value="">— Seleccionar —</option>
        ${rels.map(rel => `<option value="${rel.id}">${esc(nameOf(rel.dominant_id))} → ${esc(nameOf(rel.submissive_id))} · ${esc(rel.status)}</option>`).join('')}
      </select>
      <div id="rel_card"></div>
    </div></details>
  `;

  // ===== CARNETS =====
  html += `
    <details><summary>🪪 Carnets <span class="count">${cards.length}</span></summary><div class="body">
      <label class="small">Elegir carnet</label>
      <select id="card_pick" onchange="renderCardCard()">
        <option value="">— Seleccionar —</option>
        ${cards.map(c => `<option value="${c.id}">${esc(c.card_number)} · ${esc(c.verification_code || '')}${c.revoked ? ' · REVOCADO' : ''}</option>`).join('')}
      </select>
      <div id="card_card"></div>
    </div></details>
  `;

  content.innerHTML = html;
}

// ===== TARJETAS DINÁMICAS =====

function renderMemberCard(){
  const id = document.getElementById('member_pick').value;
  const box = document.getElementById('member_card');
  if (!id) { box.innerHTML = ''; return; }
  const x = userOf(id);
  const isAdmin = admins.includes(x.id);

  box.innerHTML = `
    <div class="item">
      <div class="rowitem" style="margin-bottom:10px;">
        ${avatarHTML(x.avatar_url, x.role === 'dominant' ? '♛' : '⛓')}
        <div style="flex:1;min-width:200px;">
          <b>${x.role === 'dominant' ? '♛' : '⛓'} ${esc(x.display_name)}</b>
          <div class="small">${x.role} — ${esc(String(x.age || ''))} años ${isAdmin ? '— ADMIN' : ''}</div>
          <div class="small">Alta: ${esc(new Date(x.created_at).toLocaleDateString())}</div>
        </div>
      </div>
      <label class="small">Nombre público</label>
      <input id="name_${x.id}" value="${esc(x.display_name)}" />
      <label class="small">Bio</label>
      <input id="bio_${x.id}" value="${esc(x.bio || '')}" />
      <button onclick="saveProfile('${x.id}')">Guardar perfil</button>
      ${!isAdmin ? `<button class="danger" onclick="deleteUser('${x.id}')">Eliminar miembro</button> <button onclick="impersonate('${x.id}')">👁 Entrar como este miembro</button>` : ''}
    </div>
  `;
}

function renderRelCard(){
  const id = document.getElementById('rel_pick').value;
  const box = document.getElementById('rel_card');
  if (!id) { box.innerHTML = ''; return; }
  const rel = rels.find(r => r.id === id);
  const record = records.find(q => q.relationship_id === rel.id);
  const card = record ? cards.find(q => q.record_id === record.id) : null;
  const dom = userOf(rel.dominant_id);
  const sub = userOf(rel.submissive_id);

  let h = `
    <div class="item">
      <div class="rel-header">
        <div class="rel-person">
          ${avatarHTML(dom.avatar_url, '♛', true)}
          <div><b>${esc(nameOf(rel.dominant_id))}</b><div class="small">Dominante</div></div>
        </div>
        <div class="rel-arrow">→</div>
        <div class="rel-person">
          ${avatarHTML(sub.avatar_url, '⛓', true)}
          <div><b>${esc(nameOf(rel.submissive_id))}</b><div class="small">Sumiso</div></div>
        </div>
        <div style="margin-left:auto;">
          <span class="small" style="background:rgba(212,175,55,.15);padding:4px 10px;border-radius:8px;border:1px solid var(--gold);">${esc(rel.status)}</span>
        </div>
      </div>
      <div style="margin:8px 0;">
  `;

  if (rel.status === 'pending') {
    h += `<button onclick="setRel('${rel.id}','confirmed')">Confirmar</button>
          <button class="danger" onclick="setRel('${rel.id}','rejected')">Rechazar</button>`;
  }
  if (rel.status === 'confirmed') {
    h += `<button class="danger" onclick="setRel('${rel.id}','released')">Liberar</button>`;
  }
  h += '</div>';

  if (record) {
    h += `
      <label class="small">Nombre de sumiso</label>
      <input id="sname_${record.relationship_id}" value="${esc(record.slave_name || '')}" />
      <label class="small">Nivel</label>
      <select id="slevel_${record.relationship_id}">
        ${['inicial','entrenamiento','avanzado','total'].map(l => `<option value="${l}" ${record.obedience_level === l ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
      <label class="small">Notas</label>
      <input id="snotes_${record.relationship_id}" value="${esc(record.notes || '')}" />
      <label class="small"><input type="checkbox" id="spublic_${record.relationship_id}" style="width:auto;margin-right:6px;" ${record.is_public ? 'checked' : ''}>Registro público</label>
      <label class="small"><input type="checkbox" id="savatar_${record.relationship_id}" style="width:auto;margin-right:6px;" ${record.show_avatar ? 'checked' : ''}>Avatar público</label>
      <div style="margin-top:8px;">
        <button onclick="saveRecord('${record.relationship_id}')">Guardar registro</button>
        <button onclick="issueCard('${record.id}')">Emitir carnet</button>
        ${card ? `<span class="small">Carnet: ${esc(card.card_number)} · ${esc(card.verification_code || '')}</span>` : ''}
      </div>
    `;
  }

  h += '</div>';
  box.innerHTML = h;
}

function renderCardCard(){
  const id = document.getElementById('card_pick').value;
  const box = document.getElementById('card_card');
  if (!id) { box.innerHTML = ''; return; }
  const c = cards.find(x => x.id === id);

  box.innerHTML = `
    <div class="item">
      <b>${esc(c.card_number)}</b>
      <span class="small">— código ${esc(c.verification_code || '')}</span>
      ${c.revoked ? ' ❌ REVOCADO' : ' ✅'}
      ${!c.revoked ? `<button class="danger" onclick="revokeCard('${c.id}')">Revocar</button>` : ''}
    </div>
  `;
}

// ===== ACCIONES =====

async function makeAdmin() {
  const id = document.getElementById('newadmin').value;
  const { error } = await db.from('app_admins').insert({ user_id: id });
  if (error) return alert(error.message);
  alert('Ahora es superusuario.');
  window.location.reload();
}

async function removeAdmin(id) {
  if (!confirm('¿Quitar privilegios de superusuario?')) return;
  const { error } = await db.from('app_admins').delete().eq('user_id', id);
  if (error) return alert(error.message);
  window.location.reload();
}

async function makeMod() {
  const id = document.getElementById('newmod').value;
  const { error } = await db.from('app_moderators').insert({ user_id: id });
  if (error) return alert(error.message);
  alert('Moderadora nombrada.');
  window.location.reload();
}

async function removeMod(id) {
  if (!confirm('¿Quitar facultades de moderación?')) return;
  const { error } = await db.from('app_moderators').delete().eq('user_id', id);
  if (error) return alert(error.message);
  window.location.reload();
}
  async function approveDominant(id) {
  if (!confirm('¿Aprobar esta cuenta como Dominante?')) return;
  const { error } = await db.rpc('staff_decide_user', { target_id: id, approve: true });
  if (error) return alert(error.message);
  alert('Dominante aprobada. Se le envió una notificación.');
  window.location.reload();
}

async function rejectDominant(id) {
  if (!confirm('¿Rechazar y ELIMINAR esta cuenta? La persona deberá volver a registrarse.')) return;
  if (!confirm('Segunda confirmación: la cuenta será borrada de forma definitiva.')) return;
  const { error } = await db.rpc('staff_decide_user', { target_id: id, approve: false });
  if (error) return alert(error.message);
  alert('Cuenta rechazada y eliminada.');
  window.location.reload();
}

async function deleteUser(id) {
  if (!confirm('¿Eliminar este miembro DEFINITIVAMENTE? Se borrará su cuenta, perfil, relaciones y registros.')) return;
  const { data, error } = await db.functions.invoke('admin-delete-user', { body: { user_id: id } });
  if (error) return alert(error.message);
  if (data && data.ok) alert('Miembro eliminado.');
  else alert('Error: ' + JSON.stringify(data));
  window.location.reload();
}

async function setRel(id, status) {
  const { error } = await db.from('relationships').update({ status }).eq('id', id);
  if (error) return alert(error.message);
  window.location.reload();
}

async function saveProfile(id) {
  const display_name = document.getElementById('name_' + id).value.trim();
  const bio = document.getElementById('bio_' + id).value.trim();
  const { error } = await db.from('profiles').update({ display_name, bio }).eq('id', id);
  if (error) return alert(error.message);
  alert('Perfil actualizado.');
}

async function saveRecord(relId) {
  const slave_name = document.getElementById('sname_' + relId).value.trim();
  const obedience_level = document.getElementById('slevel_' + relId).value;
  const notes = document.getElementById('snotes_' + relId).value;
  const is_public = document.getElementById('spublic_' + relId).checked;
  const show_avatar = document.getElementById('savatar_' + relId).checked;
  const { error } = await db.from('submissive_records')
    .update({ slave_name, obedience_level, notes, is_public, show_avatar })
    .eq('relationship_id', relId);
  if (error) return alert(error.message);
  alert('Registro guardado.');
}

async function issueCard(recordId) {
  const { data, error } = await db.from('cards').insert({ record_id: recordId }).select().single();
  if (error) return alert(error.message);
  alert('Carnet emitido.\nNúmero: ' + data.card_number + '\nCódigo: ' + (data.verification_code || ''));
  window.location.reload();
}

async function revokeCard(id) {
  if (!confirm('¿Revocar este carnet?')) return;
  const { error } = await db.from('cards').update({ revoked: true }).eq('id', id);
  if (error) return alert(error.message);
  window.location.reload();
}

async function impersonate(id) {
  if (!confirm('Entrarás a la cuenta de este miembro con control total, como si fuera él. ¿Continuar?')) return;

  const ref = SUPABASE_URL.replace('https://', '').replace('.supabase.co', '');
  const authKey = 'sb-' + ref + '-auth-token';

  localStorage.setItem('flr_admin_backup', localStorage.getItem(authKey) || '');
  localStorage.setItem('flr_impersonating', '1');

  const { data: { session } } = await db.auth.getSession();

  let res;
  try {
    res = await fetch('/api/impersonate', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + session.access_token
      },
      body: JSON.stringify({ user_id: id, redirect: window.location.origin + '/index.html' })
    });
  } catch (e) {
    localStorage.removeItem('flr_impersonating');
    localStorage.removeItem('flr_admin_backup');
    return alert('No se pudo conectar con la función: ' + e.message);
  }

  const data = await res.json().catch(() => ({}));

  if (!res.ok || !data.link) {
    localStorage.removeItem('flr_impersonating');
    localStorage.removeItem('flr_admin_backup');
    return alert('Error ' + res.status + ': ' + JSON.stringify(data));
  }

  window.location.href = data.link;
}

init();
</script>
