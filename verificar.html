<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Verificar carnet — Queendomland</title>
<style>
:root{--gold:#d4af37;--dark:#0f0f1a;--panel:#161625;--line:#2a2a3d;--violet:#7c3aed}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--dark);color:#fff}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{color:var(--gold)}
main{max-width:700px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.small{color:#a1a1aa;font-size:13px}
input{width:100%;background:#0b0b12;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px 12px;margin:6px 0 12px}
button{background:var(--gold);color:#000;font-weight:700;border:none;border-radius:10px;padding:9px 13px;cursor:pointer}
.navlink{color:var(--gold);text-decoration:none;margin-left:14px}
.chastity-box{background:rgba(124,58,237,.14);border:2px solid var(--violet);border-radius:10px;padding:14px;margin-top:14px;text-align:center}
.chastity-box h4{margin:0 0 6px;color:#c4b5fd;font-size:16px;font-weight:700}
.chastity-box p{margin:0;color:#ddd6fe;font-size:14px}
.chastity-box .big{font-size:22px;font-weight:800;color:#a78bfa;margin:6px 0}
</style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="trono-de-oro.css"><script src="toasts.js" defer></script>
</head>
<body>
<header>
  <h1 style="margin:0;">♛ Queendomland</h1>
  <div><a class="navlink" href="index.html">Inicio</a></div>
</header>
<main>
  <div class="card">
    <h2>Verificación de carnet</h2>
    <p class="small">Escribe el código de verificación que aparece en el carnet.</p>
    <input id="code" placeholder="Ejemplo: A1B2C3D4E5" />
    <button onclick="verify()">Verificar</button>
  </div>
  <div id="result"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ofyedqoipexpsvjsipze.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_X4SJUT7cnbFuv7l_1Y3OjQ__poTLx0b';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtml(v){
  return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function chastityDaysCalc(sinceISO){
  if (!sinceISO) return 0;
  const ms = Math.max(0, Date.now() - new Date(sinceISO));
  return Math.floor(ms / 864e5);
}

async function verify() {
  const code = document.getElementById('code').value.trim();
  if (!code) return alert('Escribe el código.');

  const { data, error } = await db.rpc('verify_card', { code });
  const result = document.getElementById('result');

  if (error) {
    result.innerHTML = '<div class="card"><p class="small">Error: ' + escapeHtml(error.message) + '</p></div>';
    return;
  }

  if (!data || data.length === 0) {
    result.innerHTML = `
      <div class="card">
        <h2>❌ Carnet no válido</h2>
        <p class="small">El código no coincide con ningún carnet.</p>
      </div>`;
    return;
  }

  const c = data[0];

  // Consultar si hay castidad activa
  let chastityHTML = '';
  if (c.relationship_id) {
    const { data: rel } = await db.from('relationships')
      .select('submissive_id')
      .eq('id', c.relationship_id)
      .maybeSingle();
    
    if (rel) {
      const { data: chastityAll } = await db.rpc('active_chastity');
      const activeChastity = (chastityAll || []).find(ch => ch.submissive_id === rel.submissive_id);
      
      if (activeChastity) {
        const days = chastityDaysCalc(activeChastity.since);
        chastityHTML = `
          <div class="chastity-box">
            <h4>🔒 CASTIDAD ACTIVA</h4>
            <p class="big">${days} día${days === 1 ? '' : 's'}</p>
            <p>Desde: ${new Date(activeChastity.since).toLocaleDateString()}</p>
          </div>`;
      }
    }
  }

  result.innerHTML = `
    <div class="card">
      <h2>${c.revoked ? '❌ Carnet REVOCADO' : '✅ Carnet VÁLIDO'}</h2>
      <p>Sumiso: <b>${escapeHtml(c.slave_name || 'Sin nombre')}</b></p>
      <p>Registro: <b>${escapeHtml(c.registration_number)}</b></p>
      <p>Dominante: <b>♛ ${escapeHtml(c.dominant_name)}</b></p>
      <p>Carnet: <b>${escapeHtml(c.card_number)}</b></p>
      <p>Emitido: <b>${escapeHtml(new Date(c.issued_at).toLocaleDateString())}</b></p>
      ${chastityHTML}
    </div>`;
}

const params = new URLSearchParams(window.location.search);
const preCode = params.get('code');
if (preCode) {
  document.getElementById('code').value = preCode;
  verify();
}
</script>
