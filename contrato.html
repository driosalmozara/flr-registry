let me = null;

function escapeHtml(v){
  return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function init() {
  const content = document.getElementById('content');
  const { data: { session } } = await db.auth.getSession();

  if (!session) {
    content.innerHTML = '<h2>Inicia sesión primero</h2><a class="navlink" href="index.html">Ir al inicio</a>';
    return;
  }

  const { data: profile } = await db
    .from('profiles')
    .select('id, role')
    .eq('id', session.user.id)
    .maybeSingle();

  if (!profile) {
    content.innerHTML = '<h2>Completa tu perfil primero</h2><a class="navlink" href="index.html">Ir al inicio</a>';
    return;
  }

  me = profile;

  const { data: { session: s } } = await db.auth.getSession();
  if (s) {
    await fetch('/api/expire-transfers', { method: 'POST', headers: { Authorization: 'Bearer ' + s.access_token } });
  }

  if (me.role === 'dominant') await renderDominant();
  else await renderSubmissive();
}

function contractHTML(c, isDom, activeTransfer, fromDom, toDom) {
  let html = `
    <p>Estado: <span class="badge">${escapeHtml(c.status)}</span></p>
    <textarea id="ctext_${c.id}" rows="12" ${isDom ? '' : 'disabled'}>${escapeHtml(c.content)}</textarea>
  `;

  if (isDom) {
    html += `<button onclick="saveContent('${c.id}')">Guardar texto</button>`;
    if (!c.dominant_agreed) html += `<button onclick="signDominant('${c.id}')">Firmar como Dominante</button>`;
    if (c.status !== 'revoked') html += `<button class="danger" onclick="revokeContract('${c.id}')">Revocar</button>`;
  } else {
    if (!c.submissive_agreed) html += `<button onclick="signSubmissive('${c.id}')">Acepto y firmo</button>`;
  }

  html += `<p class="small">Firma Dominante: ${c.dominant_signed_at ? escapeHtml(new Date(c.dominant_signed_at).toLocaleString()) : 'pendiente'}</p>`;
  html += `<p class="small">Firma sumiso: ${c.submissive_signed_at ? escapeHtml(new Date(c.submissive_signed_at).toLocaleString()) : 'pendiente'}</p>`;

  if (activeTransfer) {
    html += `
      <div class="anexo">
        <h3>📜 ANEXO DE CESIÓN</h3>
        <p class="small"><b>Duración:</b> ${activeTransfer.duration === 'indefinida' ? 'Indefinida' : 'Temporal'}</p>
        ${activeTransfer.expires_at ? `<p class="small"><b>Retorno automático:</b> ${new Date(activeTransfer.expires_at).toLocaleDateString()}</p>` : ''}
        ${activeTransfer.note ? `<p class="small"><b>Condiciones especiales:</b><br>${escapeHtml(activeTransfer.note)}</p>` : ''}
        <p class="small"><b>Firmado por:</b> ${activeTransfer.signed_at ? escapeHtml(new Date(activeTransfer.signed_at).toLocaleString()) : 'pendiente'}</p>
        ${!activeTransfer.signed_at && isDom ? `<button onclick="signAnexo('${activeTransfer.id}')">Firmar anexo de cesión</button>` : ''}
      </div>
    `;
  }

  html += `<button onclick="downloadContractPDF('${c.id}')">⬇ Descargar PDF</button>`;
  return html;
}

async function renderDominant() {
  const content = document.getElementById('content');

  const { data: subs } = await db
    .from('relationships')
    .select('id, profiles!relationships_submissive_id_fkey(display_name, id)')
    .eq('dominant_id', me.id)
    .eq('status', 'confirmed');

  if (!subs || subs.length === 0) {
    content.innerHTML = '<h2>Sin sumisos confirmados</h2><p class="small">Cuando confirmes un sumiso podrás crear su contrato.</p>';
    return;
  }

  const ids = subs.map(s => s.id);

  const { data: contracts } = await db
    .from('contracts')
    .select('*')
    .in('relationship_id', ids);

  const { data: transfers } = await db
    .from('transfers')
    .select('*, from_profile:profiles!transfers_from_dominant_id_fkey(display_name), to_profile:profiles!transfers_to_dominant_id_fkey(display_name)')
    .eq('to_dominant_id', me.id)
    .eq('status', 'activa');

  let html = '';

  subs.forEach(sub => {
    const c = (contracts || []).find(x => x.relationship_id === sub.id);
    const activeTransfer = (transfers || []).find(t => t.submissive_id === sub.profiles?.id);

    html += `<div class="card"><h3>⛓ ${escapeHtml(sub.profiles?.display_name || 'Sumiso')}</h3>`;

    if (!c) {
      html += `<p class="small">Aún no hay contrato.</p><button onclick="createContract('${sub.id}')">Crear contrato</button>`;
    } else {
      html += contractHTML(c, true, activeTransfer);
    }

    // NUEVO: Botón de Liberar (Romper vínculo)
    html += `
      <div style="margin-top:18px; border-top:1px solid var(--line); padding-top:14px;">
        <button class="danger" onclick="releaseSubmissive('${sub.id}')">Liberar sumiso (Romper vínculo)</button>
      </div>
    `;

    html += '</div>';
  });

  content.innerHTML = html;
}

async function renderSubmissive() {
  const content = document.getElementById('content');

  const { data: rel } = await db

    .select('id, profiles!relationships_dominant_id_fkey(display_name, id)')
    .eq('submissive_id', me.id)
    .eq('status', 'confirmed')
    .maybeSingle();

  if (!rel) {
    content.innerHTML = '<h2>Sin Dominante confirmada</h2><p class="small">Cuando pertenezcas a una Dominante verás aquí tu contrato.</p>';
    return;
  }

  const { data: c } = await db
    .from('contracts')
    .select('*')
    .eq('relationship_id', rel.id)
    .maybeSingle();

  if (!c) {
    content.innerHTML = `<div class="card"><h3>♛ ${escapeHtml(rel.profiles?.display_name || 'Dominante')}</h3><p class="small">Tu Dominante aún no ha creado el contrato.</p></div>`;
    return;
  }

  const { data: activeTransfer } = await db
    .from('transfers')
    .select('*, from_profile:profiles!transfers_from_dominant_id_fkey(display_name), to_profile:profiles!transfers_to_dominant_id_fkey(display_name)')

  content.innerHTML = `<div class="card"><h3>Contrato con ♛ ${escapeHtml(rel.profiles?.display_name || 'Dominante')}</h3>` + contractHTML(c, false, activeTransfer) + '</div>';
}

async function createContract(relId) {
  const { data: rel } = await db
    .from('relationships')
    .select('dominant_id, submissive_id')
    .eq('id', relId)
    .maybeSingle();

  if (!rel) return alert('Relación no encontrada.');

  const { data: dom } = await db.from('profiles').select('display_name').eq('id', rel.dominant_id).maybeSingle();
  const { data: sub } = await db.from('profiles').select('display_name').eq('id', rel.submissive_id).maybeSingle();

  const { error } = await db.from('contracts').insert({
    relationship_id: relId,
    content: makeDefaultText(dom?.display_name || '', sub?.display_name || ''),
    status: 'pending'
  });

  if (error) return alert(error.message);

  window.location.reload();
}

async function saveContent(id) {
  const content = document.getElementById('ctext_' + id).value;

  const { error } = await db.from('contracts').update({ content }).eq('id', id);

  if (error) return alert(error.message);

  alert('Texto guardado.');
}

async function signDominant(id) {
  const { error } = await db.from('contracts').update({ dominant_agreed: true }).eq('id', id);

  if (error) return alert(error.message);

  window.location.reload();
}

async function signSubmissive(id) {
  const { error } = await db.from('contracts').update({ submissive_agreed: true }).eq('id', id);

  if (error) return alert(error.message);

  window.location.reload();
}

async function revokeContract(id) {
  if (!confirm('¿Revocar este contrato?')) return;

  const { error } = await db.from('contracts').update({ status: 'revoked' }).eq('id', id);

  if (error) return alert(error.message);

  window.location.reload();
}

async function signAnexo(transferId) {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return alert('Inicia sesión.');
  const r = await fetch('/api/sign-transfer', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ transfer_id: transferId })
  });
  const j = await r.json();
  if (!r.ok) return alert(j.error || 'Error al firmar el anexo.');
  alert('Anexo firmado. Cesión activa.');
  window.location.reload();
}

async function downloadContractPDF(id) {
  const { data: c } = await db
    .from('contracts')
    .select('*, relationships(dominant_id, submissive_id)')
    .eq('id', id)
    .maybeSingle();

  if (!c) return;

  const { data: dom } = await db.from('profiles').select('display_name').eq('id', c.relationships.dominant_id).maybeSingle();
  const { data: sub } = await db.from('profiles').select('display_name').eq('id', c.relationships.submissive_id).maybeSingle();

  const { data: activeTransfer } = await db
    .from('transfers')
    .select('*, from_profile:profiles!transfers_from_dominant_id_fkey(display_name), to_profile:profiles!transfers_to_dominant_id_fkey(display_name)')
    .eq('submissive_id', c.relationships.submissive_id)
    .eq('status', 'activa')
    .maybeSingle();

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'pt', format: 'a4' });

  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(16);
  pdf.text('CONTRATO DE ESCLAVITUD', 40, 60);

  pdf.setFont('helvetica', 'normal');
  pdf.setFontSize(10);
  pdf.text('Supremacia Femenina', 40, 78);

  pdf.setFontSize(11);
  pdf.text('Dominante: ' + (dom?.display_name || ''), 40, 110);
  pdf.text('Sumiso: ' + (sub?.display_name || ''), 40, 128);
  pdf.text('Estado: ' + c.status, 40, 146);

  const lines = pdf.splitTextToSize(c.content || '', 515);
  pdf.text(lines, 40, 175);

  let y = 175 + lines.length * 14 + 30;
  pdf.text('Firma Dominante: ' + (c.dominant_signed_at ? new Date(c.dominant_signed_at).toLocaleString() : 'pendiente'), 40, y);
  pdf.text('Firma Sumiso: ' + (c.submissive_signed_at ? new Date(c.submissive_signed_at).toLocaleString() : 'pendiente'), 40, y + 18);
  pdf.text('Documento simbolico y consensuado entre adultos.', 40, y + 46);

  if (activeTransfer) {
    pdf.addPage();
    pdf.setFontSize(14);
    pdf.setFont('helvetica', 'bold');
    pdf.text('ANEXO DE CESIÓN', 40, 60);
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(11);
    
    let ay = 90;
    pdf.text('Duración: ' + (activeTransfer.duration === 'indefinida' ? 'Indefinida' : 'Temporal'), 40, ay);
    ay += 18;
    
    if (activeTransfer.expires_at) {
      pdf.text('Retorno automático: ' + new Date(activeTransfer.expires_at).toLocaleDateString(), 40, ay);
      ay += 18;
    }
    
    if (activeTransfer.note) {
      pdf.text('Condiciones especiales:', 40, ay);
      ay += 18;
      const noteLines = pdf.splitTextToSize(activeTransfer.note, 515);
      pdf.text(noteLines, 40, ay);
      ay += noteLines.length * 14 + 10;
    }
    
    pdf.text('Firmado por Dominante receptora: ' + (activeTransfer.signed_at ? new Date(activeTransfer.signed_at).toLocaleString() : 'pendiente'), 40, ay);
    ay += 18;
    pdf.text('Cedida por: ' + (activeTransfer.from_profile?.display_name || ''), 40, ay);
    ay += 18;
    pdf.text('Aceptada por: ' + (activeTransfer.to_profile?.display_name || ''), 40, ay);
  }

  pdf.save('contrato-supremacia-femenina.pdf');
}
    async function releaseSubmissive(relId) {

  const { data: { session } } = await db.auth.getSession();
  if (!session) return alert('Inicia sesión.');
  
  const r = await fetch('/api/liberar-sumiso', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ relationship_id: relId })
  });
  
  const j = await r.json();
  if (!r.ok) return alert(j.error || 'Error al liberar.');
  
  alert('Sumiso liberado. El vínculo ha sido roto y su carnet anulado.');

}
