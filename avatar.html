<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Avatares — Supremacía Femenina</title>
<style>
:root{--gold:#d4af37;--dark:#0f0f1a;--panel:#161625;--line:#2a2a3d}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--dark);color:#fff}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{color:var(--gold)}
main{max-width:700px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.small{color:#a1a1aa;font-size:13px}
select,input{width:100%;background:#0b0b12;border:1px solid var(--line);color:#fff;border-radius:10px;padding:9px 12px;margin:5px 0 10px}
button{background:var(--gold);color:#000;font-weight:700;border:none;border-radius:10px;padding:9px 13px;cursor:pointer;margin-right:8px}
.navlink{color:var(--gold);text-decoration:none;margin-left:14px}
img.avatar{width:130px;height:130px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#0b0b12}
input[type=file]{color:#a1a1aa}
.sub-item{display:flex;gap:16px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;margin:10px 0;background:#0b0b12}
.sub-avatar{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#161625;flex:none}
.sub-info{flex:1;min-width:200px}
.sub-info h3{margin:0 0 6px;font-size:16px}
.sub-info p{margin:0;color:#a1a1aa;font-size:13px}
.hidden{display:none}
</style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="trono-de-oro.css"><script src="toasts.js" defer></script>
</head>
<body>
<header>
  <h1 style="margin:0;">♛ Avatares</h1>
  <div><a class="navlink" href="index.html">Inicio</a></div>
</header>
<main>
  <div id="content" class="card">Cargando...</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ofyedqoipexpsvjsipze.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_X4SJUT7cnbFuv7l_1Y3OjQ__poTLx0b';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null;
let myProfile = null;

function esc(v){
  return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function extOf(name){
  const m = (name || '').split('.').pop();
  return (m || 'png').replace(/[^a-zA-Z0-9]/g,'').slice(0,8) || 'png';
}

async function init() {
  const content = document.getElementById('content');
  const { data: { session } } = await db.auth.getSession();

  if (!session) {
    content.innerHTML = '<h2>Inicia sesión primero</h2><a class="navlink" href="index.html">Ir al inicio</a>';
    return;
  }

  me = session.user.id;

  const { data: profile } = await db.from('profiles').select('id, role, avatar_url').eq('id', me).maybeSingle();
  myProfile = profile;

  if (!myProfile) {
    content.innerHTML = '<h2>Completa tu perfil primero</h2><a class="navlink" href="index.html">Ir al inicio</a>';
    return;
  }

  const { data: superFlag } = await db.rpc('am_i_superadmin');
  const isSuper = !!superFlag;

  let html = '';

  html += `
    <div class="card">
      <h2>Tu avatar</h2>
      <div style="text-align:center;">
        <img class="avatar" id="myAvatar" src="${esc(myProfile.avatar_url || '')}" />
        <br/><br/>
        <input type="file" id="myFile" accept="image/*" />
        <br/>
        <button onclick="uploadMyAvatar()">Cambiar mi avatar</button>
      </div>
    </div>
  `;

  if (isSuper || myProfile.role === 'dominant') {
    let subs = [];

    if (isSuper) {
      const { data: users } = await db
        .from('profiles')
        .select('id, display_name, role, avatar_url')
        .neq('id', me)
        .order('display_name')
        .limit(300);
      subs = users || [];
    } else {
      const { data: rels } = await db
        .from('relationships')
        .select('profiles!relationships_submissive_id_fkey(id, display_name, avatar_url)')
        .eq('dominant_id', me)
        .eq('status', 'confirmed');
      subs = (rels || []).map(r => r.profiles).filter(Boolean);
    }

    if (subs.length > 0) {
      html += `
        <div class="card">
          <h2>${isSuper ? 'Avatares de todos los miembros' : 'Avatares de tus sumisos'}</h2>
          <p class="small">
            ${isSuper ? 'Como superusuario puedes cambiar el avatar de cualquier miembro sin su consentimiento.' :
              'Como Dominante puedes cambiar el avatar de tus sumisos sin necesidad de su consentimiento. Los cambios son inmediatos.'}
          </p>
          ${subs.map(s => `
            <div class="sub-item">
              <img class="sub-avatar" id="sub_${s.id}" src="${esc(s.avatar_url || '')}" />
              <div class="sub-info">
                <h3>${s.role === 'dominant' ? '♛' : '⛓'} ${esc(s.display_name)}</h3>
                <p>${s.role === 'dominant' ? 'Dominante' : 'Sumiso'}</p>
              </div>
              <div>
                <input type="file" id="file_${s.id}" accept="image/*" style="display:none;" onchange="uploadSubAvatar('${s.id}')" />
                <button onclick="document.getElementById('file_${s.id}').click()">Cambiar</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }
  }

  content.innerHTML = html;
}

async function uploadMyAvatar() {
  const file = document.getElementById('myFile').files[0];
  if (!file) return alert('Selecciona una imagen.');
  if (!file.type.startsWith('image/')) return alert('El archivo debe ser una imagen.');

  const oldUrl = myProfile.avatar_url || '';
  const path = me + '/' + Date.now() + '.' + extOf(file.name);
  const { error } = await db.storage.from('avatars').upload(path, file);
  if (error) return alert(error.message);

  const { data } = db.storage.from('avatars').getPublicUrl(path);
  const { error: updateError } = await db.from('profiles').update({ avatar_url: data.publicUrl }).eq('id', me);
  if (updateError) return alert(updateError.message);

  // Limpia el archivo viejo para no llenar el storage
  if (oldUrl) {
    try {
      const oldPath = decodeURIComponent(oldUrl.split('/avatars/')[1] || '');
      if (oldPath) await db.storage.from('avatars').remove([oldPath]);
    } catch(e){}
  }

  myProfile.avatar_url = data.publicUrl;
  alert('Avatar actualizado.');
  window.location.reload();
}

async function uploadSubAvatar(subId) {
  const file = document.getElementById('file_' + subId).files[0];
  if (!file) return alert('Selecciona una imagen.');
  if (!file.type.startsWith('image/')) return alert('El archivo debe ser una imagen.');

  // Lee la URL vieja del sumiso para limpiarla después
  const { data: oldProf } = await db.from('profiles').select('avatar_url').eq('id', subId).maybeSingle();
  const oldUrl = (oldProf && oldProf.avatar_url) || '';

  const path = subId + '/' + Date.now() + '.' + extOf(file.name);
  const { error } = await db.storage.from('avatars').upload(path, file);
  if (error) return alert(error.message);

  const { data } = db.storage.from('avatars').getPublicUrl(path);
  const { error: updateError } = await db.from('profiles').update({ avatar_url: data.publicUrl }).eq('id', subId);
  if (updateError) return alert(updateError.message);

  if (oldUrl) {
    try {
      const oldPath = decodeURIComponent(oldUrl.split('/avatars/')[1] || '');
      if (oldPath) await db.storage.from('avatars').remove([oldPath]);
    } catch(e){}
  }

  alert('Avatar actualizado.');
  window.location.reload();
}

init();
</script>
