<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Avatares — Supremacía Femenina</title>
<style>
:root{--gold:#d4af37;--dark:#0f0f1a;--panel:#161625;--line:#2a2a3d}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--dark);color:#fff}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{color:var(--gold)}
main{max-width:700px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.small{color:#a1a1aa;font-size:13px}
select,input{width:100%;background:#0b0b12;border:1px solid var(--line);color:#fff;border-radius:10px;padding:9px 12px;margin:5px 0 10px}
button{background:var(--gold);color:#000;font-weight:700;border:none;border-radius:10px;padding:9px 13px;cursor:pointer}
.navlink{color:var(--gold);text-decoration:none;margin-left:14px}
img.avatar{width:130px;height:130px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#0b0b12}
input[type=file]{color:#a1a1aa}
</style>
</head>
<body>
<header>
  <h1 style="margin:0;">♛ Avatares</h1>
  <div><a class="navlink" href="index.html">Inicio</a></div>
</header>
<main>
  <div id="content" class="card">Cargando...</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ofyedqoipexpsvjsipze.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_X4SJUT7cnbFuv7l_1Y3OjQ__poTLx0b';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null;
let myProfile = null;

function esc(v){
  return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function init() {
  const content = document.getElementById('content');
  const { data: { session } } = await db.auth.getSession();

  if (!session) {
    content.innerHTML = '<h2>Inicia sesión primero</h2><a class="navlink" href="index.html">Ir al inicio</a>';
    return;
  }

  me = session.user.id;

  const { data: profile } = await db.from('profiles').select('id, role').eq('id', me).maybeSingle();
  myProfile = profile;

  if (!myProfile) {
    content.innerHTML = '<h2>Completa tu perfil primero</h2><a class="navlink" href="index.html">Ir al inicio</a>';
    return;
  }

  const { data: superFlag } = await db.rpc('am_i_superadmin');
  const isSuper = !!superFlag;

  let targets = [{ id: me, label: 'Mi propio avatar' }];

  if (isSuper) {
    const { data: users } = await db
      .from('profiles')
      .select('id, display_name, role')
      .order('display_name')
      .limit(300);

    (users || []).forEach(u => {
      if (u.id !== me) targets.push({ id: u.id, label: (u.role === 'dominant' ? '♛ ' : '⛓ ') + u.display_name });
    });
  } else if (myProfile.role === 'dominant') {
    const { data: subs } = await db
      .from('relationships')
      .select('profiles!relationships_submissive_id_fkey(id, display_name)')
      .eq('dominant_id', me)
      .eq('status', 'confirmed');

    (subs || []).forEach(s => {
      if (s.profiles) targets.push({ id: s.profiles.id, label: '⛓ ' + s.profiles.display_name });
    });
  }

  content.innerHTML = `
    <h2>${isSuper ? 'Gestión total de avatares' : myProfile.role === 'dominant' ? 'Tu avatar y el de tus sumisos' : 'Tu avatar'}</h2>
    <select id="target" onchange="preview()">
      ${targets.map(t => `<option value="${t.id}">${esc(t.label)}</option>`).join('')}
    </select>
    <img class="avatar" id="prev" src="" />
    <br/>
    <input type="file" id="file" accept="image/*" />
    <br/>
    <button onclick="uploadAvatar()">Subir / cambiar avatar</button>
    <p class="small">
      ${isSuper ? 'Como superusuario puedes cambiar el avatar de cualquier miembro.' :
        myProfile.role === 'dominant' ? 'Como Dominante puedes cambiar el avatar de tus sumisos confirmados.' :
        'Solo tú puedes cambiar tu avatar.'}
    </p>
  `;

  await preview();
}

async function preview() {
  const target = document.getElementById('target').value;

  const { data: p } = await db
    .from('profiles')
    .select('avatar_url')
    .eq('id', target)
    .maybeSingle();

  document.getElementById('prev').src = p?.avatar_url || '';
}

async function uploadAvatar() {
  const target = document.getElementById('target').value;
  const file = document.getElementById('file').files[0];

  if (!file) return alert('Selecciona una imagen.');

  const path = target + '/avatar';

  const { error } = await db.storage
    .from('avatars')
    .upload(path, file, { upsert: true });

  if (error) return alert(error.message);

  const { data } = db.storage.from('avatars').getPublicUrl(path);

  const { error: updateError } = await db
    .from('profiles')
    .update({ avatar_url: data.publicUrl })
    .eq('id', target);

  if (updateError) return alert(updateError.message);

  alert('Avatar actualizado.');
  await preview();
}

init();
</script>

</body>
</html>
