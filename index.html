<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supremacía Femenina</title>
  <style>
    :root {
      --gold: #d4af37;
      --dark: #0f0f1a;
      --panel: #161625;
      --line: #2a2a3d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Segoe UI, Arial, sans-serif;
      background: var(--dark);
      color: #fff;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1,
    h2,
    h3 {
      color: var(--gold);
    }

    main {
      max-width: 950px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input,
    select,
    textarea {
      width: 100%;
      background: #0b0b12;
      border: 1px solid var(--line);
      color: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      margin: 6px 0 14px;
    }

    button {
      background: var(--gold);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
    }

    button.danger {
      background: #7f1d1d;
      color: #fff;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
