<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Registro público — Supremacía Femenina</title>
<style>
:root{--gold:#d4af37;--dark:#0f0f1a;--panel:#161625;--line:#2a2a3d}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--dark);color:#fff}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{color:var(--gold)}
main{max-width:900px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#0b0b12}
.small{color:#a1a1aa;font-size:13px}
.navlink{color:var(--gold);text-decoration:none;margin-left:14px}
.free{color:#4ade80;font-size:13px}
.rowitem{display:flex;gap:12px;align-items:center}
.ava{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex:none}
.ava.empty{display:flex;align-items:center;justify-content:center;background:#161625;color:var(--gold);font-size:22px}
</style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="trono-de-oro.css"><script src="toasts.js" defer></script>
</head>
<body>
<header>
  <h1 style="margin:0;">♛ Supremacía Femenina</h1>
  <div><a class="navlink" href="index.html">Inicio</a></div>
</header>
<main>
  <div class="card">
    <h2>Registro público</h2>
    <p class="small">Dominantes que eligieron aparecer, sumisos certificados y sumisos sin dueña.</p>
  </div>
  <div id="doms" class="card">Cargando...</div>
  <div id="list" class="card">Cargando...</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ofyedqoipexpsvjsipze.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_X4SJUT7cnbFuv7l_1Y3OjQ__poTLx0b';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtml(v){
  return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function avatarHTML(url, fallback) {
  if (url) return `<img class="ava" src="${escapeHtml(url)}" />`;
  return `<div class="ava empty">${fallback}</div>`;
}

(async () => {
  const [doms, subs] = await Promise.all([
    db.rpc('public_dominants'),
    db.rpc('public_registry')
  ]);

  const domsBox = document.getElementById('doms');
  const listBox = document.getElementById('list');

  // Dominantes
  let html = '<h2>♛ Dominantes</h2>';

  if (!doms.data || doms.data.length === 0) {
    html += '<p class="small">Todavía no hay Dominantes públicas.</p>';
  } else {
    html += doms.data.map(d => `
      <div class="item rowitem">
        ${avatarHTML(d.avatar_url, '♛')}
        <div>
          <h3 style="margin:0;">${escapeHtml(d.display_name)} <span class="small" style="color:var(--gold);">· ${escapeHtml(d.rank || '')}</span></h3>
          <p class="small">${escapeHtml(d.bio || '')}</p>
          <p class="small">⛓ Sumisos certificados: ${d.certified_count || 0}</p>
        </div>
      </div>
    `).join('');
  }

  domsBox.innerHTML = html;

  // Sumisos
  let html2 = '<h2>⛓ Sumisos</h2>';

  if (subs.error) {
    html2 += '<p class="small">Error: ' + escapeHtml(subs.error.message) + '</p>';
  } else if (!subs.data || subs.data.length === 0) {
    html2 += '<p class="small">Todavía no hay sumisos en el registro público.</p>';
  } else {
    html2 += subs.data.map(r => {
      const libre = r.dominant_name === 'Sumiso sin Dueña';

      if (libre) {
        return `
          <div class="item rowitem">
            ${avatarHTML(r.avatar_url, '⛓')}
            <div>
              <h3 style="margin:0;">${escapeHtml(r.slave_name || 'Sumiso')}</h3>
              <p class="free">● Sumiso sin Dueña — disponible</p>
            </div>
          </div>
        `;
      }

      return `
        <div class="item rowitem">
          ${avatarHTML(r.avatar_url, '⛓')}
          <div>
            <h3 style="margin:0;">${escapeHtml(r.slave_name || 'Sumiso sin nombre')}</h3>
            <p class="small">Nº ${escapeHtml(r.registration_number)}</p>
            <p class="small">Pertenece a: ♛ ${escapeHtml(r.dominant_name)}</p>
            <p class="small">Desde: ${escapeHtml(r.collar_date || '')} · Nivel: ${escapeHtml(r.obedience_level || '')}</p>
          </div>
        </div>
      `;
    }).join('');
  }

  listBox.innerHTML = html2;
})();
</script>

</body>
</html>
