function esc(v){ return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function ageFrom(dt){ const n=new Date(); let a=n.getFullYear()-dt.getFullYear(); const md=n.getMonth()-dt.getMonth(); if(md<0||(md===0&&n.getDate()<dt.getDate()))a--; return a; }

function socialHref(c){
  const v = (c.value||'').trim();

    facebook: 'https://facebook.com/' + user,
    instagram: 'https://instagram.com/' + user,
    x: 'https://x.com/' + user,
    threads: 'https://threads.net/@' + user,
    tiktok: 'https://tiktok.com/@' + user,
    snapchat: 'https://snapchat.com/add/' + user,
    linkedin: 'https://linkedin.com/in/' + user
  };
  return map[c.platform] || v;
}

function physicalHTML(p){

async function init(){

  }

  const staff = await Promise.all([
    db.from('app_admins').select('user_id'),
    db.from('app_moderators').select('user_id'),
    db.from('app_chat_mods').select('user_id')
  ]);
  adminIds = new Set((staff[0].data||[]).map(function(x){ return x.user_id; }));

  chatModIds = new Set((staff[2].data||[]).map(function(x){ return x.user_id; }));

  const ids = allProfiles.map(function(p){ return p.id; });
  if (ids.length) {
    const { data: contacts } = await db.from('member_contacts').select('*').in('user_id', ids).order('created_at');
    (contacts||[]).forEach(function(c){ (contactsByUser[c.user_id] = contactsByUser[c.user_id] || []).push(c); });
  }

  window.badgesByUser = {};
  try {
    const { data: mb } = await db.from('member_badges')
      .select('user_id, badge:badges(code, name, emoji, color, description)')
      .eq('visible_in_salon', true).is('revoked_at', null);
    (mb || []).forEach(function(m){
      if (!window.badgesByUser[m.user_id]) window.badgesByUser[m.user_id] = [];

function classify(p){
  if (p.role === 'dominant') return (p.dom_verified && p.available_public) ? { group:'dom' } : null;
  const ownerId = relBySub[p.id];
  if (!ownerId) return p.available_public ? { group:'free' } : null;
  const rec = recordsBySub[p.id];
  return (rec && rec.is_public) ? { group:'owned', ownerId: ownerId, rec: rec } : null;
}

  async function requestSub(subId){
  if (!meId) { alert('Inicia sesión para solicitar un sumiso.'); window.location.href = 'index.html'; return; }
  if (!meIsDomVerified) { alert('Solo las Dominantes verificadas pueden solicitar sumisos.'); return; }
  // Vía RPC (creada para evitar el error RLS); si no existe, cae al insert directo
  try {
    const { data, error } = await db.rpc('request_submissive', { p_sub_id: subId });
    if (!error) {
      if (data && data.ok) { alert('⛓ Solicitud enviada. El miembro podrá aceptarla o rechazarla desde su panel.'); render(); return; }
      alert((data && data.error) || 'No se pudo enviar la solicitud.');
      return;
    }
    if (!/42883|does not exist|function/i.test(error.message || '')) { alert(error.message); return; }
  } catch (e) { /* continuar con fallback */ }
  const { error } = await db.from('relationships').insert({
    dominant_id: meId, submissive_id: subId, status: 'pending', initiated_by: 'dominant'
  });
  if (error) return alert(error.message);
  await db.from('notifications').insert({
    user_id: subId, type: 'relationship', title: '♛ Solicitud de Dominante',
    body: 'Una Dominante ha solicitado tomarte como su sumiso. Revisa tu panel para aceptar o rechazar.',
    link: 'index.html'
  });
  myRelPartners[subId] = 'pending';   // ← línea clave
  alert('⛓ Solicitud enviada. El miembro podrá aceptarla o rechazarla desde su panel.');
  render();
}
function setTab(g, btn){
  currentTab = g;
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  btn.classList.add('active');
  render();
}

        : '<div class="ava empty">👤</div>') +
      '<div style="text-align:center;"><b style="color:var(--gold);font-size:16px;">' + (info.group==='dom'?'♛ ':'⛓ ') + esc(p.display_name) + '</b>' + staffIcons(p.id) + '</div>' +
      (info.group==='owned' && info.rec && info.rec.slave_name ? '<div style="text-align:center;" class="small">como <b>' + esc(info.rec.slave_name) + '</b></div>' : '') +
      (info.group==='owned' && ownerName ? '<div style="text-align:center;" class="small">♛ de <b>' + esc(ownerName) + '</b></div>' : '') +
      '<div style="text-align:center;">' + roleBadge + '</div>' +
      badgesHTML(window.badgesByUser[p.id] || []) +
      birthdayBanner(p) +
      '<div style="text-align:center;">' + extrasHTML(p) + '</div>' +
      fetishesHTML(p) +
      physicalHTML(p) +
      (p.country && p.social_links_public ? '<div style="text-align:center;" class="small">🌎 ' + esc(p.country) + '</div>' : '') +
      (p.bio ? '<p class="small salon-bio" style="margin:0;white-space:pre-wrap;">' + esc(p.bio) + '</p>' : '') +
      contactsHTML(p) +
      (p.show_about_public && p.bio_extended ? '<details class="about"><summary>Sobre mí</summary><p class="salon-about">' + esc(p.bio_extended) + '</p></details>' : '') +
      reqBtn +
      '<div style="margin-top:auto;text-align:center;"><a class="navlink" style="margin:0;" href="mi-galeria.html?user=' + p.id + '">📸 Galería</a></div>' +
    '</div>';
}

function render(){
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  const fc = document.getElementById('fcountry').value;
  const groups = { dom: [], free: [], owned: [] };
  allProfiles.forEach(function(p){
    const info = classify(p);
    if (!info) return;
    if (fc && p.country !== fc) return;
    if (q && !((p.display_name||'').toLowerCase().includes(q) || (p.country||'').toLowerCase().includes(q))) return;
    groups[info.group].push({ p: p, info: info });
  });

  let html = '';
  const sections = [
    ['dom', '♛ Dominantes verificadas'],
    ['free', '⛓ Sumisos y sumisas sin Dueña'],
    ['owned', '⛓ Sumisos y sumisas en propiedad']
  ];
  sections.forEach(function(sec){
    if (currentTab !== 'all' && currentTab !== sec[0]) return;
    const items = groups[sec[0]];
    if (!items.length) return;
    html += '<div class="card"><h3 style="margin-top:0;">' + sec[1] + ' (' + items.length + ')</h3><div class="grid">' +
      items.map(function(x){ return cardHTML(x.p, x.info); }).join('') + '</div></div>';
  });
  if (!html) html = '<div class="card"><p class="small">No hay miembros que coincidan con tu búsqueda o que hayan decidido mostrarse.</p></div>';
  document.getElementById('list').innerHTML = html;
}

init();
</script>
