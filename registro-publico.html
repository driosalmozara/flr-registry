<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Salón de miembros — Supremacía Femenina</title><style>
:root{--gold:#d4af37;--dark:#0f0f1a;--panel:#161625;--line:#2a2a3d}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--dark);color:#fff}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{color:var(--gold)}
main{max-width:900px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#0b0b12}
.item.own-profile{border-color:var(--gold);background:linear-gradient(135deg,rgba(212,175,55,.08),rgba(212,175,55,.02))}
.small{color:#a1a1aa;font-size:13px}
.navlink{color:var(--gold);text-decoration:none;margin-left:14px}
.free{color:#4ade80;font-size:13px}
.rowitem{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ava{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex:none}
.ava.empty{display:flex;align-items:center;justify-content:center;background:#161625;color:var(--gold);font-size:22px}
button{background:var(--gold);color:#000;font-weight:700;border:none;border-radius:10px;padding:8px 12px;cursor:pointer;margin-top:8px;margin-right:6px}
button.secondary{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.own-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(212,175,55,.2),rgba(212,175,55,.1));border:1px solid var(--gold);color:var(--gold);padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:8px}
.own-badge::before{content:"♛";font-size:14px}
.meta-line{color:#a1a1aa;font-size:12px;margin-top:4px}
.meta-line b{color:#e5e5e5}
</style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="trono-de-oro.css"><script src="toasts.js" defer></script>
</head>
<body>
<header>
  <h1 style="margin:0;">♛ Supremacía Femenina</h1>
  <div><a class="navlink" href="index.html">Inicio</a></div>
</header>
<main>
  <div class="card">
    <h2>Registro público</h2>
    <p class="small">Dominantes que eligieron aparecer, sumisos certificados y sumisos sin dueña.</p>
  </div>
  <div id="doms" class="card">Cargando...</div>
  <div id="list" class="card">Cargando...</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ofyedqoipexpsvjsipze.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_X4SJUT7cnbFuv7l_1Y3OjQ__poTLx0b';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let myProfile = null;
let idByName = {};
let profilesById = {};
  let chastityMap = {};

function chastityBadge(uid){
  const since = chastityMap[uid];
  if (!since) return '';
  const d = Math.floor(Math.max(0, Date.now() - new Date(since)) / 864e5);
  return `<p class="small" style="color:#a78bfa;">🔒 Castidad: ${d} día${d === 1 ? '' : 's'}</p>`;
}

function escapeHtml(v){
  return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function avatarHTML(url, fallback) {
  if (url) return `<img class="ava" src="${escapeHtml(url)}" />`;
  return `<div class="ava empty">${fallback}</div>`;
}

function domId(d){
  return d.user_id || d.id || d.dominant_id || idByName[d.display_name] || null;
}

function messageButton(userId) {
  if (!currentUser || !userId || userId === currentUser.id) return '';
  return `<button onclick="window.location.href='mensajes.html?start=${userId}'">💬 Mensaje</button>`;
}

  function galleryButton(userId) {
  if (!userId) return '';
  return `<button class="secondary" onclick="window.location.href='mi-galeria.html?user=${userId}'">🖼 Galería personal</button>`;}
function ownBadge() {
  return `<div class="own-badge">Este es tu perfil</div>`;
}

function requestSubButton(subId) {
  if (!myProfile || myProfile.role !== 'dominant') return '';
  if (!subId || subId === currentUser?.id) return '';
  return `<button class="secondary" onclick="requestSubmissive('${subId}')">♛ Solicitar ser su Dominante</button>`;
}

  function genderTag(profile) {
  if (!profile || !profile.gender) return '';
  return profile.gender === 'mujer'
    ? ' <span class="small" style="color:#d4af37;">♀ Mujer</span>'
    : ' <span class="small" style="color:#8ab4f8;">♂ Hombre</span>';
}
function socialMeta(profile) {
  if (!profile || !profile.social_links_public) return '';
  const parts = [];
  if (profile.country) parts.push(`<b>🌎 ${escapeHtml(profile.country)}</b>`);
  if (profile.social_links) parts.push(`<b>📱 ${escapeHtml(profile.social_links)}</b>`);
  return parts.length ? `<div class="meta-line">${parts.join(' · ')}</div>` : '';
}

async function requestSubmissive(subId) {
  if (!currentUser) return alert('Inicia sesión primero.');
  if (myProfile.role !== 'dominant') return alert('Solo las Dominantes pueden solicitar sumisos.');

  const { data: existing } = await db
    .from('relationships')
    .select('id, status')
    .eq('dominant_id', currentUser.id)
    .eq('submissive_id', subId)
    .in('status', ['pending', 'confirmed'])
    .maybeSingle();

  if (existing) {
    if (existing.status === 'pending') return alert('Ya enviaste una solicitud a este sumiso.');
    if (existing.status === 'confirmed') return alert('Este sumiso ya es tuyo.');
  }

  const { error } = await db.from('relationships').insert({
    dominant_id: currentUser.id,
    submissive_id: subId,
    status: 'pending',
    initiated_by: 'dominant'
  });

  if (error) return alert(error.message);

  alert('Solicitud enviada. El sumiso decidirá si aceptarla.');
  window.location.reload();
}

(async () => {
  const { data: { session } } = await db.auth.getSession();
  currentUser = session?.user || null;

  // Cargar todos los perfiles para mostrar país/redes cuando sea público
  const { data: allProfiles } = await db
    .from('profiles')
    .select('id, display_name, country, social_links, social_links_public, gender, avatar_url').limit(500);  
  (allProfiles || []).forEach(p => {
    idByName[p.display_name] = p.id;
    profilesById[p.id] = p;
  });

  if (currentUser) {
    const { data: profile } = await db
      .from('profiles')
      .select('id, role')
      .eq('id', currentUser.id)
      .maybeSingle();
    myProfile = profile;
  }

    const [doms, subs, chas] = await Promise.all([
    db.rpc('public_dominants'),
    db.rpc('public_registry'),
    db.rpc('active_chastity')
  ]);
  (chas.data || []).forEach(c => { chastityMap[c.submissive_id] = c.since; });

  const domsBox = document.getElementById('doms');
  const listBox = document.getElementById('list');

  // Dominantes
  let html = '<h2>♛ Dominantes</h2>';

  if (!doms.data || doms.data.length === 0) {
    html += '<p class="small">Todavía no hay Dominantes públicas.</p>';
  } else {
    html += doms.data.map(d => {
      const uid = domId(d);
      const isOwn = !!currentUser && uid === currentUser.id;
      const prof = profilesById[uid] || {};
      return `
      <div class="item rowitem ${isOwn ? 'own-profile' : ''}">
        ${avatarHTML(d.avatar_url, '♛')}
        <div style="flex:1;min-width:200px;">
          <h3 style="margin:0;">${escapeHtml(d.display_name)} <span class="small" style="color:var(--gold);">· ${escapeHtml(d.rank || '')}</span></h3>
          <p class="small">${escapeHtml(d.bio || '')}</p>
          <p class="small">⛓ Sumisos certificados: ${d.certified_count || 0}</p>
          ${socialMeta(prof)}
          ${isOwn ? ownBadge() : (galleryButton(uid) + messageButton(uid))}        </div>
      </div>
    `}).join('');
  }

  domsBox.innerHTML = html;

  // Sumisos
  let html2 = '<h2>⛓ Sumisos</h2>';

  if (subs.error) {
    html2 += '<p class="small">Error: ' + escapeHtml(subs.error.message) + '</p>';
  } else if (!subs.data || subs.data.length === 0) {
    html2 += '<p class="small">Todavía no hay sumisos en el registro público.</p>';
  } else {
    html2 += subs.data.map(r => {
      const libre = r.dominant_name === 'Sumiso sin Dueña';
      const uid = r.submissive_id || null;
      const isOwn = !!currentUser && uid === currentUser.id;
      const prof = profilesById[uid] || {};

      if (libre) {
        return `
          <div class="item rowitem ${isOwn ? 'own-profile' : ''}">
            ${avatarHTML(r.avatar_url || prof.avatar_url, '⛓')}
            <div style="flex:1;min-width:200px;">
              <h3 style="margin:0;">${escapeHtml(r.slave_name || 'Sumiso')}${genderTag(prof)}</h3>              <p class="free">● Sumiso sin Dueña — disponible</p>
              ${chastityBadge(uid)}
              ${socialMeta(prof)}
              ${isOwn ? ownBadge() : (galleryButton(uid) + requestSubButton(uid) + messageButton(uid))}            </div>
          </div>
        `;
      }

      return `
        <div class="item rowitem ${isOwn ? 'own-profile' : ''}">
          ${avatarHTML(r.avatar_url || prof.avatar_url, '⛓')}
          <div style="flex:1;min-width:200px;">
            <h3 style="margin:0;">${escapeHtml(r.slave_name || 'Sumiso sin nombre')}${genderTag(prof)}</h3>            <p class="small">Nº ${escapeHtml(r.registration_number)}</p>
            <p class="small">Pertenece a: ♛ ${escapeHtml(r.dominant_name)}</p>
            ${chastityBadge(uid)}
            <p class="small">Desde: ${escapeHtml(r.collar_date || '')} · Nivel: ${escapeHtml(r.obedience_level || '')}</p>
            ${socialMeta(prof)}
            ${isOwn ? ownBadge() : (galleryButton(uid) + messageButton(uid))}          </div>
        </div>
      `;
    }).join('');
  }

  listBox.innerHTML = html2;
})();
</script>

</html>
