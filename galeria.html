<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Galería — Queendomland</title>
<style>
:root{--gold:#d4af37;--dark:#0f0f1a;--panel:#161625;--line:#2a2a3d}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--dark);color:#fff}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{color:var(--gold)}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.small{color:#a1a1aa;font-size:13px}
button{background:var(--gold);color:#000;font-weight:700;border:none;border-radius:10px;padding:8px 12px;cursor:pointer;margin-right:6px}
button.danger{background:#7f1d1d;color:#fff}button.secondary{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.navlink{color:var(--gold);text-decoration:none;margin-left:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{width:100%;height:130px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
select,input{width:100%;background:#0b0b12;border:1px solid var(--line);color:#fff;border-radius:10px;padding:9px 12px;margin:5px 0 10px}
.warnbox{border:2px solid #f59e0b;background:rgba(245,158,11,.08);border-radius:12px;padding:14px;margin:12px 0}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="trono-de-oro.css"><script src="toasts.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<header><h1 style="margin:0;">📸 Galería</h1><div><a class="navlink" href="index.html">Inicio</a></div></header>
<main><div id="content" class="card">Cargando...</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ofyedqoipexpsvjsipze.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_X4SJUT7cnbFuv7l_1Y3OjQ__poTLx0b';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let me=null,role=null,zones=[],currentZone=null;
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

async function tmpPartners(subId){
  const active=[],ended=[];
  const {data:ann}=await db.from('sharing_annexes').select('id').eq('submissive_id',subId);
  if(ann&&ann.length){
    const {data:m}=await db.from('sharing_members').select('status, dominant_id, dom:profiles!sharing_members_dominant_id_fkey(display_name)').in('annex_id',ann.map(a=>a.id));
    (m||[]).forEach(x=>{(x.status==='active'?active:ended).push({id:x.dominant_id,name:x.dom?.display_name||'?'});});
  }
  const {data:tr}=await db.from('transfers').select('status, to_dominant_id, to_profile:profiles!transfers_to_dominant_id_fkey(display_name)').eq('submissive_id',subId);
  (tr||[]).forEach(t=>{(t.status==='activa'?active:ended).push({id:t.to_dominant_id,name:t.to_profile?.display_name||'?'});});
  return {active,ended};
}

async function buildZones(){
  zones=[];
  if(role==='dominant'){
    const {data:own}=await db.from('relationships').select('id, submissive_id, profiles!relationships_submissive_id_fkey(display_name)').eq('dominant_id',me).eq('status','confirmed');
    for(const r of own||[]){
      const nm=r.profiles?.display_name||'Sumiso';
      zones.push({path:r.id,label:`📸 Principal —  ${nm}`,kind:'main'});
      const p=await tmpPartners(r.submissive_id);
      p.active.forEach(a=>zones.push({path:`tmp_${r.submissive_id}_${a.id}`,label:`🕓 Temporal — ⛓ ${nm} × ♛ ${a.name}`,kind:'tmp'}));
      p.ended.forEach(a=>zones.push({path:`tmp_${r.submissive_id}_${a.id}`,label:`🗃 Relación rota — ⛓ ${nm} × ♛ ${a.name}`,kind:'backup'}));
    }
    const {data:shm}=await db.from('sharing_members').select('annex:sharing_annexes(submissive_id, sub:profiles!sharing_annexes_submissive_id_fkey(display_name))').eq('dominant_id',me).eq('status','active');
    (shm||[]).forEach(m=>zones.push({path:`tmp_${m.annex.submissive_id}_${me}`,label:`🕓 Temporal (compartido) — ⛓ ${m.annex.sub?.display_name||''}`,kind:'tmp'}));
  } else {
    const {data:rel}=await db.from('relationships').select('id, profiles!relationships_dominant_id_fkey(display_name)').eq('submissive_id',me).eq('status','confirmed').maybeSingle();
    if(rel){
      zones.push({path:rel.id,label:`📸 Principal —  ${rel.profiles?.display_name||''}`,kind:'main'});
      const p=await tmpPartners(me);
      p.active.forEach(a=>zones.push({path:`tmp_${me}_${a.id}`,label:`🕓 Temporal — ♛ ${a.name}`,kind:'tmp'}));
    }
  }
}

async function render(){
  const content=document.getElementById('content');
  await buildZones();
  if(!zones.length){content.innerHTML='<div class="card"><p class="small">No hay galerías para mostrar.</p></div>';return;}
  content.innerHTML=`
    <h2 style="margin-top:0;">📸 Galerías</h2>
    <p class="small">Las galerías de relación ya no requieren consentimiento del sumiso. Las galerías temporales viven mientras dure la cesión o compartición; al romperse, la Dueña del contrato puede respaldarlas en ZIP antes de su eliminación.</p>
    <select id="zone_pick" onchange="openZone(this.value)">
      ${zones.map((z,i)=>`<option value="${i}">${esc(z.label)}</option>`).join('')}
    </select>
    <div id="zonebox"></div>`;
  openZone('0');
}

async function openZone(i){
  currentZone=zones[Number(i)];
  const box=document.getElementById('zonebox');
  const {data,error}=await db.storage.from('galeria').list(currentZone.path);
  if(error){box.innerHTML='<p class="small">Error: '+esc(error.message)+'</p>';return;}
  const files=data||[];
  if(currentZone.kind==='backup'){
    box.innerHTML=files.length?`
      <div class="warnbox">
        <h3 style="margin-top:0;">🗃 Galería de una relación rota</h3>
        <p class="small">Esta galería pertenece a una cesión o compartición terminada. Como Dueña del contrato puedes descargar un respaldo comprimido antes de liberar el almacenamiento. ${files.length} archivo(s).</p>
        <button onclick="zipAndPurge()">⬇ Descargar ZIP y eliminar</button>
        <button class="danger" onclick="purgeOnly()">🗑 Eliminar sin respaldo</button>
      </div>`:'<p class="small">Esta carpeta ya fue vaciada.</p>';
    return;
  }
  let html=`<div class="card"><h3 style="margin-top:0;">${esc(currentZone.label)}</h3>
    <input type="file" id="gfile" accept="image/*"/>
    <button onclick="uploadFile()">Subir imagen</button>
    <div id="ggrid" class="grid" style="margin-top:12px;"></div></div>`;
  box.innerHTML=html;
  await loadImages(files);
}

async function loadImages(files){
  const grid=document.getElementById('ggrid');
  if(!files||!files.length){grid.innerHTML='<p class="small">Aún no hay imágenes.</p>';return;}
  let html='';
  for(const f of files){
    const s=await db.storage.from('galeria').createSignedUrl(currentZone.path+'/'+f.name,3600);
    if(s.data)html+=`<div><img class="thumb" src="${s.data.signedUrl}"/><button class="danger" style="margin-top:6px;" onclick="deleteFile('${esc(f.name)}')">Eliminar</button></div>`;
  }
  grid.innerHTML=html||'<p class="small">Aún no hay imágenes.</p>';
}

async function uploadFile(){
  const f=document.getElementById('gfile').files[0];
  if(!f)return alert('Selecciona una imagen.');
  const {error}=await db.storage.from('galeria').upload(currentZone.path+'/'+Date.now()+'-'+f.name,f);
  if(error)return alert(error.message);
  const {data}=await db.storage.from('galeria').list(currentZone.path);
  await loadImages(data);
}
async function deleteFile(name){
  if(!confirm('¿Eliminar esta imagen?'))return;
  const {error}=await db.storage.from('galeria').remove([currentZone.path+'/'+name]);
  if(error)return alert(error.message);
  const {data}=await db.storage.from('galeria').list(currentZone.path);
  await loadImages(data);
}
async function zipAndPurge(){
  if(!confirm('Se descargará un ZIP con toda la galería y luego se eliminarán los archivos del almacenamiento. ¿Continuar?'))return;
  const {data}=await db.storage.from('galeria').list(currentZone.path);
  if(!data||!data.length)return alert('La carpeta ya está vacía.');
  const zip=new JSZip();
  for(const f of data){
    const s=await db.storage.from('galeria').createSignedUrl(currentZone.path+'/'+f.name,3600);
    const r=await fetch(s.data.signedUrl);
    zip.file(f.name,await r.blob());
  }
  const blob=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='respaldo-galeria-'+currentZone.path+'.zip';
  a.click();
  await db.storage.from('galeria').remove(data.map(f=>currentZone.path+'/'+f.name));
  alert('✅ Respaldo descargado y almacenamiento liberado.');
  openZone(zones.indexOf(currentZone));
}
async function purgeOnly(){
  if(!confirm('Se ELIMINARÁN definitivamente estos archivos sin respaldo. ¿Continuar?'))return;
  const {data}=await db.storage.from('galeria').list(currentZone.path);
  if(data&&data.length)await db.storage.from('galeria').remove(data.map(f=>currentZone.path+'/'+f.name));
  alert('Archivos eliminados.');
  openZone(zones.indexOf(currentZone));
}
async function init(){
  const content=document.getElementById('content');
  const {data:{session}}=await db.auth.getSession();
  if(!session){content.innerHTML='<h2>Inicia sesión primero</h2>';return;}
  me=session.user.id;
  const {data:p}=await db.from('profiles').select('role').eq('id',me).maybeSingle();
  role=p?p.role:null;
  await render();
}
init();
</script>
</body>
</html>
