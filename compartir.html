<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Compartir Sumisos — Queendomland</title>
<style>
:root{--gold:#d4af37;--dark:#0f0f1a;--panel:#161625;--line:#2a2a3d}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--dark);color:#fff}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{color:var(--gold)}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.small{color:#a1a1aa;font-size:13px}
select,input,textarea{width:100%;background:#0b0b12;border:1px solid var(--line);color:#fff;border-radius:10px;padding:9px 12px;margin:5px 0 10px}
button{background:var(--gold);color:#000;font-weight:700;border:none;border-radius:10px;padding:8px 12px;cursor:pointer;margin-right:6px}
button.danger{background:#7f1d1d;color:#fff}button.secondary{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.navlink{color:var(--gold);text-decoration:none;margin-left:14px}
.item{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:#0b0b12}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.tag.pending{border:1px solid #f59e0b;color:#f59e0b}.tag.active{border:1px solid var(--gold);color:var(--gold)}
.tag.ended{border:1px solid #71717a;color:#a1a1aa}
.cond{background:rgba(212,175,55,.07);border:1px solid rgba(212,175,55,.3);border-radius:10px;padding:10px;margin:8px 0;white-space:pre-wrap}
label.dom{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="trono-de-oro.css"><script src="toasts.js" defer></script>
</head>
<body>
<header><h1 style="margin:0;">🤝 Compartir Sumisos</h1><div><a class="navlink" href="index.html">Inicio</a></div></header>
<main><div id="content" class="card">Cargando...</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ofyedqoipexpsvjsipze.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_X4SJUT7cnbFuv7l_1Y3OjQ__poTLx0b';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function dates(m){
  let s='';
  if(m.signed_at)s+='Inicio: <b>'+new Date(m.signed_at).toLocaleString()+'</b>';
  if(m.ended_at)s+=' · Término: <b>'+new Date(m.ended_at).toLocaleString()+'</b>';
  return s?'<div class="small" style="margin-top:4px;">🗓 '+s+'</div>':'';
}
function tag(st){return st==='pending'?'por firmar':st==='active'?'activa':'terminada';}
async function render(){
  const content=document.getElementById('content');
  const {data:D,error}=await db.rpc('share_page_data');
  if(error||!D){content.innerHTML='<p class="small">Error: '+esc((error&&error.message)||'sin datos')+'</p>';return;}
  let html='';

  if(D.role==='dominant'){
    html+=`<div class="card"><h2 style="margin-top:0;">🤝 Compartir a un sumiso</h2>
      <p class="small">Elige a tu sumiso y a una o más Dominantes. Redacta las condiciones del anexo. <b>No requiere aprobación del sumiso</b>; cada Dominante invitada debe firmar: desde entonces será también Dueña con todas sus atribuciones.</p>
      ${D.owned.length?`
      <label class="small">Sumiso en propiedad</label>
      <select id="sh_sub">${D.owned.map(s=>`<option value="${s.rel_id}">⛓ ${esc(s.name)}</option>`).join('')}</select>
      <label class="small">Dominantes con quienes compartir</label>
      <div style="max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:10px;">
        ${D.doms.map(d=>`<label class="dom"><input type="checkbox" style="width:auto;margin:0;" value="${d.id}" class="sh_dom"/> ♛ ${esc(d.name)}</label>`).join('')||'<p class="small">No hay otras Dominantes.</p>'}
      </div>
      <label class="small">Condiciones del anexo</label>
      <textarea id="sh_cond" rows="3" placeholder="Ej.: horarios compartidos, protocolos, límites de disciplina…"></textarea>
      <button onclick="createAnnex()">📜 Crear anexo de compartición</button>`:'<p class="small">No tienes sumisos en propiedad.</p>'}
    </div>`;

    if(D.my_annexes.length){
      html+='<div class="card"><h2 style="margin-top:0;">📜 Mis anexos como Dueña</h2>';
      D.my_annexes.forEach(a=>{
        html+=`<div class="item"><b>⛓ ${esc(a.sub_name)}</b>
          ${a.conditions?`<div class="cond">${esc(a.conditions)}</div>`:''}
          <div class="small">Creado: ${new Date(a.created_at).toLocaleString()}</div>`;
        (a.members||[]).forEach(m=>{
          html+=`<div style="margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:10px;">
            ♛ ${esc(m.dom_name)} <span class="tag ${m.status}">${tag(m.status)}</span>${dates(m)}
            ${m.status!=='ended'?`<button class="danger" style="margin-top:6px;" onclick="removeMember('${m.id}')">🚫 Dejar de compartir con ella</button>`:''}
          </div>`;
        });
        html+='</div>';
      });
      html+='</div>';
    }
  }

  if(D.pending.length){
    html+='<div class="card"><h2 style="margin-top:0;">✍ Anexos por firmar ('+D.pending.length+')</h2>';
    D.pending.forEach(m=>{
      html+=`<div class="item"><b>⛓ ${esc(m.sub_name)}</b> · ofrecido por ♛ ${esc(m.owner_name)}
        ${m.conditions?`<div class="cond">${esc(m.conditions)}</div>`:'<p class="small">Sin condiciones especiales.</p>'}
        <button onclick="sign('${m.member_id}')">✍ Firmar anexo (acepto ser también su Dueña)</button>
      </div>`;
    });
    html+='</div>';
  }

  if(D.active.length){
    html+='<div class="card"><h2 style="margin-top:0;">♛ Sumisos que comparto</h2>';
    D.active.forEach(m=>{
      html+=`<div class="item"><b>⛓ ${esc(m.sub_name)}</b> · Dueña del contrato: ♛ ${esc(m.owner_name)}
        ${m.conditions?`<div class="cond">${esc(m.conditions)}</div>`:''}${dates(m)}
        <button class="danger" style="margin-top:6px;" onclick="leave('${m.member_id}')">🕊 Deshacer anexo (romper mi vínculo)</button>
      </div>`;
    });
    html+='</div>';
  }

  if(D.role==='submissive'&&D.about_me.length){
    html+='<div class="card"><h2 style="margin-top:0;">🗂 Anexos sobre mí (archivo)</h2>';
    D.about_me.forEach(a=>{
      html+=`<div class="item"><b>Dueña del contrato:</b> ♛ ${esc(a.owner_name)}
        ${a.conditions?`<div class="cond">${esc(a.conditions)}</div>`:''}`;
      (a.members||[]).forEach(m=>{
        html+=`<div style="margin:6px 0;">♛ ${esc(m.dom_name)} <span class="tag ${m.status}">${m.status==='pending'?'por firmar':m.status==='active'?'me comparte':'terminada'}</span>${dates(m)}</div>`;
      });
      html+='</div>';
    });
    html+='</div>';
  }

  content.innerHTML=html||'<div class="card"><p class="small">No hay anexos de compartición en tu historia.</p></div>';
}
async function createAnnex(){
  const rel=document.getElementById('sh_sub').value;
  const ids=[...document.querySelectorAll('.sh_dom:checked')].map(c=>c.value);
  const cond=document.getElementById('sh_cond').value;
  if(!ids.length)return alert('Elige al menos una Dominante.');
  const {data}=await db.rpc('create_sharing_annex',{rel_id:rel,dom_ids:ids,conditions:cond});
  if(!data||!data.ok)return alert(data?.error||'Error');
  alert('📜 Anexo creado. Las Dominantes invitadas recibirán la notificación para firmarlo.');
  await render();
}
async function sign(id){
  if(!confirm('Al firmar pasarás a ser también Dueña de este sumiso, con todas las atribuciones. ¿Continuar?'))return;
  const {data}=await db.rpc('sign_sharing_annex',{member_id:id});
  if(!data||!data.ok)return alert(data?.error||'Error');
  alert('✍ Anexo firmado. Ya compartes al sumiso.');
  await render();
}
async function leave(id){
  if(!confirm('¿Deshacer este anexo respecto de ti?\n\nTu vínculo con el sumiso se romperá y quedará archivado con fecha de término.'))return;
  const {data}=await db.rpc('leave_sharing_annex',{member_id:id});
  if(!data||!data.ok)return alert(data?.error||'Error');
  await render();
}
async function removeMember(id){
  if(!confirm('¿Dejar de compartir al sumiso con esta Dominante?\n\nSu vínculo se romperá de inmediato y quedará archivado.'))return;
  const {data}=await db.rpc('remove_sharing_member',{member_id:id});
  if(!data||!data.ok)return alert(data?.error||'Error');
  await render();
}
(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(!session){document.getElementById('content').innerHTML='<h2>Inicia sesión primero</h2>';return;}
  await render();
})();
</script>
</body>
</html>
