<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Carnet — Supremacía Femenina</title>
<style>
:root{--gold:#d4af37;--dark:#0f0f1a;--panel:#161625;--line:#2a2a3d}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--dark);color:#fff}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{color:var(--gold)}
main{max-width:900px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.small{color:#a1a1aa;font-size:13px}
select{width:100%;background:#0b0b12;border:1px solid var(--line);color:#fff;border-radius:10px;padding:9px 12px;margin:5px 0 10px}
button{background:var(--gold);color:#000;font-weight:700;border:none;border-radius:10px;padding:9px 13px;cursor:pointer}
.navlink{color:var(--gold);text-decoration:none;margin-left:14px}

#card{
  width:85.6mm;
  height:54mm;
  background:linear-gradient(135deg,#1a1a2e,#0f0f1a);
  border:2px solid var(--gold);
  border-radius:4mm;
  padding:5mm;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  margin:15px auto;
}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.card-title{color:var(--gold);font-weight:800;letter-spacing:2px;font-size:11px}
.card-sub{color:#a1a1aa;font-size:7.5px;margin-top:1mm}
.qr{width:15mm;height:15mm;background:#fff;border-radius:2mm;padding:1mm}
.line{font-size:9px;color:#e5e5e5;margin:1mm 0}
.line span{color:#a1a1aa}
.line b{color:#fff}
.card-foot{font-size:6.5px;color:#71717a;border-top:1px solid rgba(212,175,55,.4);padding-top:2mm}

@media print{
  body *{visibility:hidden}
  #card, #card *{visibility:visible}
  #card{position:fixed;left:0;top:0;margin:0}
}
</style>
</head>
<body>
<header>
  <h1 style="margin:0;">♛ Carnet oficial</h1>
  <div><a class="navlink" href="index.html">Inicio</a></div>
</header>
<main>
  <div id="content" class="card">Cargando...</div>
</main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ofyedqoipexpsvjsipze.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_X4SJUT7cnbFuv7l_1Y3OjQ__poTLx0b';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null;
let myProfile = null;

function escapeHtml(v){
  return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function init() {
  const content = document.getElementById('content');
  const { data: { session } } = await db.auth.getSession();

  if (!session) {
    content.innerHTML = '<h2>Inicia sesión primero</h2><a class="navlink" href="index.html">Ir al inicio</a>';
    return;
  }

  me = session.user;

  const { data: profile } = await db.from('profiles').select('id, role').eq('id', me.id).maybeSingle();
  myProfile = profile;

  if (!myProfile) {
    content.innerHTML = '<h2>Completa tu perfil primero</h2><a class="navlink" href="index.html">Ir al inicio</a>';
    return;
  }

  if (myProfile.role === 'dominant') {
    const { data: subs } = await db
      .from('relationships')
      .select('id, profiles!relationships_submissive_id_fkey(display_name)')
      .eq('dominant_id', me.id)
      .eq('status', 'confirmed');

    if (!subs || subs.length === 0) {
      content.innerHTML = '<h2>Sin sumisos confirmados</h2><p class="small">Cuando confirmes un sumiso podrás imprimir su carnet.</p>';
      return;
    }

    content.innerHTML = `
      <h2>Elige al sumiso</h2>
      <select id="pick" onchange="loadCard(this.value)">
        ${subs.map(s => `<option value="${s.id}">⛓ ${escapeHtml(s.profiles?.display_name || 'Sumiso')}</option>`).join('')}
      </select>
      <div id="cardwrap"></div>
    `;

    await loadCard(subs[0].id);
  } else {
    const { data: rel } = await db
      .from('relationships')
      .select('id')
      .eq('submissive_id', me.id)
      .eq('status', 'confirmed')
      .maybeSingle();

    if (!rel) {
      content.innerHTML = '<h2>Sin Dominante confirmada</h2><p class="small">Cuando pertenezcas a una Dominante verás aquí tu carnet.</p>';
      return;
    }

    content.innerHTML = '<div id="cardwrap"></div>';
    await loadCard(rel.id);
  }
}

async function loadCard(relId) {
  const wrap = document.getElementById('cardwrap');

  const { data: record } = await db
    .from('submissive_records')
    .select('*')
    .eq('relationship_id', relId)
    .maybeSingle();

  if (!record) {
    wrap.innerHTML = '<p class="small">No hay registro todavía.</p>';
    return;
  }

  const { data: card } = await db
    .from('cards')
    .select('*')
    .eq('record_id', record.id)
    .order('issued_at', { ascending: false })
    .limit(1)
    .maybeSingle();

  const { data: rel } = await db
    .from('relationships')
    .select('profiles!relationships_dominant_id_fkey(display_name)')
    .eq('id', relId)
    .maybeSingle();

  if (!card) {
    wrap.innerHTML = '<p class="small">La Dominante aún no emite el carnet.</p>';
    return;
  }

  const verifyUrl = window.location.origin + '/verificar.html?code=' + encodeURIComponent(card.verification_code || '');
  const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=' + encodeURIComponent(verifyUrl);

  wrap.innerHTML = `
    <div id="card">
      <div class="card-top">
        <div>
          <div class="card-title">♛ SUPREMACÍA FEMENINA</div>
          <div class="card-sub">Carnet oficial de sumisión</div>
        </div>
        <img class="qr" src="${qrSrc}" />
      </div>

      <div>
        <div class="line"><span>Sumiso:</span> <b>${escapeHtml(record.slave_name || 'Sin nombre')}</b></div>
        <div class="line"><span>Nº registro:</span> <b>${escapeHtml(record.registration_number)}</b></div>
        <div class="line"><span>Pertenece a:</span> <b>♛ ${escapeHtml(rel?.profiles?.display_name || 'Dominante')}</b></div>
        <div class="line"><span>Desde:</span> <b>${escapeHtml(record.collar_date || '')}</b> · <span>Nivel:</span> <b>${escapeHtml(record.obedience_level || '')}</b></div>
        <div class="line"><span>Carnet:</span> <b>${escapeHtml(card.card_number)}</b> · <span>Código:</span> <b>${escapeHtml(card.verification_code || '')}</b></div>
      </div>

      <div class="card-foot">
        Documento consensuado entre adultos · Escanea el QR o verifica el código en ${escapeHtml(window.location.host)}/verificar.html
      </div>
    </div>

    <div style="text-align:center;">
      <button onclick="window.print()"> Imprimir carnet</button>
            <button onclick="downloadCardPDF()">⬇ Descargar PDF</button>
      <p class="small">Consejo: al imprimir, elige orientación horizontal y escala 100%. El tamaño es el de una credencial (85.6 × 54 mm).</p>
    </div>
  `;
}

  async function downloadCardPDF() {
  const el = document.getElementById('card');
  const canvas = await html2canvas(el, { scale: 3, backgroundColor: '#0f0f1a' });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [86, 54] });
  pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 86, 54);
  pdf.save('carnet-supremacia-femenina.pdf');
}
init();
</script>
</body>
</html>
