<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Disponibilidad — Supremacía Femenina</title>
<style>
:root{--gold:#d4af37;--dark:#0f0f1a;--panel:#161625;--line:#2a2a3d}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--dark);color:#fff}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{color:var(--gold)}
main{max-width:700px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.small{color:#a1a1aa;font-size:13px}
button{background:var(--gold);color:#000;font-weight:700;border:none;border-radius:10px;padding:9px 13px;cursor:pointer}
.navlink{color:var(--gold);text-decoration:none;margin-left:14px}
label{display:flex;gap:10px;align-items:center;font-size:15px;margin:12px 0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}
</style>
</head>
<body>
<header>
  <h1 style="margin:0;">♛ Visibilidad pública</h1>
  <div><a class="navlink" href="index.html">Inicio</a></div>
</header>
<main>
  <div id="content" class="card">Cargando...</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ofyedqoipexpsvjsipze.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_X4SJUT7cnbFuv7l_1Y3OjQ__poTLx0b';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null;

function escapeHtml(v){
  return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function init() {
  const content = document.getElementById('content');
  const { data: { session } } = await db.auth.getSession();

  if (!session) {
    content.innerHTML = '<h2>Inicia sesión primero</h2><a class="navlink" href="index.html">Ir al inicio</a>';
    return;
  }

  me = session.user;

  const { data: profile } = await db
    .from('profiles')
    .select('role, available_public, show_avatar_public, display_name')
    .eq('id', me.id)
    .maybeSingle();

  if (!profile) {
    content.innerHTML = '<h2>Completa tu perfil primero</h2><a class="navlink" href="index.html">Ir al inicio</a>';
    return;
  }

  if (profile.role === 'submissive') {
    const { data: owned } = await db
      .from('relationships')
      .select('id, profiles!relationships_dominant_id_fkey(display_name)')
      .eq('submissive_id', me.id)
      .eq('status', 'confirmed')
      .maybeSingle();

    if (owned) {
      content.innerHTML = `
        <h2>Perteneces a ♛ ${escapeHtml(owned.profiles?.display_name || 'tu Dominante')}</h2>
        <p class="small">
          Al ser tomado por una Dominante perdiste la libertad de gestionar tu visibilidad.
          Ahora <b>solo tu Dominante</b> decide si apareces en el registro público
          y si se muestra tu avatar.
        </p>
      `;
      return;
    }
  }

  const appearLabel = profile.role === 'dominant'
    ? 'Aparecer en el registro público como Dominante'
    : 'Aparecer en el registro público como "Sumiso sin Dueña"';

  content.innerHTML = `
    <h2>${profile.role === 'dominant' ? '♛ Visibilidad de Dominante' : 'Sumiso sin Dueña'}</h2>
    <p class="small">Mientras no pertenezcas a una Dominante, tú controlas tu visibilidad.
    ${profile.role === 'dominant' ? 'Como Dominante, tú decides cuándo aparecer.' : 'En cuanto una Dominante te confirme, ella tomará el control.'}</p>

    <label>
      <input type="checkbox" id="avail" ${profile.available_public ? 'checked' : ''} />
      ${appearLabel}
    </label>

    <label>
      <input type="checkbox" id="showava" ${profile.show_avatar_public ? 'checked' : ''} />
      Mostrar mi avatar en el registro público
    </label>

    <button onclick="save()">Guardar</button>
    <p class="small">Si no has subido avatar, hazlo en la página "Mi avatar".</p>
  `;
}

async function save() {
  const available_public = document.getElementById('avail').checked;
  const show_avatar_public = document.getElementById('showava').checked;

  const { error } = await db
    .from('profiles')
    .update({ available_public, show_avatar_public })
    .eq('id', me.id);

  if (error) return alert(error.message);

  alert('Guardado.');
  window.location.reload();
}

init();
</script>

</body>
</html>
